---
name: Validate and Generate OpenAPI

on:
  pull_request:
    paths:
      - 'tenancy-api-mapping/**'

permissions:
  contents: read

jobs:
  check-generate:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d  # v2.16.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Bootstrap CI environment
        uses: open-edge-platform/orch-ci/.github/actions/bootstrap@485a15a77fd03f74e95def2efb568e380cf5fd84  # 2026.1.3
        with:
          gh_token: ${{ secrets.SYS_EMF_GH_TOKEN }}

      - name: Generate OpenAPI specs and combined spec
        run: |
          cd tenancy-api-mapping
          make gen-convert-combine-all

      - name: Check for changes
        run: |
          npm --version
          if [[ `git status --porcelain` ]]; then
            echo "### Error: Changes detected after running make gen-convert-combine-all"
            echo "### git status --porcelain"
            git status --porcelain
            echo "### git diff"
            git diff
            echo "### Error: Changes detected after running make gen-convert-combine-all" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "No changes detected - OpenAPI is up to date" >> $GITHUB_STEP_SUMMARY
          fi
