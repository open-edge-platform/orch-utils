---

name: Validate and Generate OpenAPI

on:
  pull_request:
    paths:
      - 'tenancy-api-mapping/**'

permissions: {}

jobs:
  check-generate:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap CI environment
        uses: open-edge-platform/orch-ci/.github/actions/bootstrap@7d984ef618c17ff5e616879327f19f37b67307ee  # 0.1.9
        with:
          gh_token: ${{ secrets.SYS_ORCH_GITHUB }}

      - name: Generate OpenAPI specs and combined spec
        run: |
          cd tenancy-api-mapping
          make gen-convert-combine-all

      - name: Check for changes
        run: |
          npm --version
          if [[ `git status --porcelain` ]]; then
            echo "### Error: Changes detected after running make gen-convert-combine-all"
            echo "### git status --porcelain"
            git status --porcelain
            echo "### git diff"
            git diff
            echo "### Error: Changes detected after running make gen-convert-combine-all" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "No changes detected - OpenAPI is up to date" >> $GITHUB_STEP_SUMMARY
          fi
