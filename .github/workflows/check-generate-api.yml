---

name: Validate and Generate OpenAPI

on:
  pull_request:
    paths:
      - 'tenancy-api-mapping/**'

permissions:
  contents: read

jobs:
  check-generate:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@6c439dc8bdf85cadbbce9ed30d1c7b959517bc49  # v2.12.2
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap CI environment
        uses: open-edge-platform/orch-ci/.github/actions/bootstrap@d3fe218ea585fb390b73c87f9e482cbe1424829c  # 0.1.9
        with:
          orch_ci_repo_ref: cf81328e4c9526e579181efb1f609af06071889b
          gh_token: ${{ secrets.SYS_ORCH_GITHUB }}

      - name: Generate OpenAPI specs and combined spec
        run: |
          cd tenancy-api-mapping
          make gen-convert-combine-all

      - name: Check for changes
        run: |
          npm --version
          if [[ `git status --porcelain` ]]; then
            echo "### Error: Changes detected after running make gen-convert-combine-all"
            echo "### git status --porcelain"
            git status --porcelain
            echo "### git diff"
            git diff
            echo "### Error: Changes detected after running make gen-convert-combine-all" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "No changes detected - OpenAPI is up to date" >> $GITHUB_STEP_SUMMARY
          fi
