---
name: Auto Bump Chart Version

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'charts/**'
      - 'keycloak-tenant-controller/**'
      - 'squid-proxy/**'
      - 'cert-synchronizer/**'
      - 'aws-sm-proxy/**'
      - 'auth-service/**'

permissions: read-all

jobs:
  bump-chart:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ github.head_ref }}

      - name: Discover Changed Files
        id: check-files
        uses: open-edge-platform/orch-ci/discover-changed-files@main  # zizmor: ignore[unpinned-uses]
        with:
          project_folder: "."

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump Chart Versions and App Versions
        if: contains(steps.check-files.outputs.changed_files, 'charts/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          files="${{ steps.check-files.outputs.changed_files }}"

          # Extract unique chart names from changed files
          changed_charts=$(echo "$files" | grep -o 'charts/[^/]*' | cut -d'/' -f2 | sort -u | tr '\n' ' ')
          updated_charts=""

          for chart_name in $changed_charts; do
            CHART_FILE="charts/$chart_name/Chart.yaml"

            # Check if version or appVersion were already modified in this PR
            if git diff "origin/${BASE_REF}"..HEAD -- "$CHART_FILE" | grep -E '^\+.*\b(version|appVersion):'; then
              echo "Skipping $chart_name - version/appVersion already modified in PR"
              continue
            fi
            
            if [ -f "$CHART_FILE" ]; then

              # Bump appVersion in Chart.yaml
              current_app_version=$(yq eval '.appVersion' "$CHART_FILE")

              IFS='.' read -ra APP_VERSION_PARTS <<< "$current_app_version"
              major=${APP_VERSION_PARTS[0]}
              minor=${APP_VERSION_PARTS[1]}
              patch=${APP_VERSION_PARTS[2]}
              new_patch=$((patch + 1))
              new_app_version="${major}.${minor}.${new_patch}"

              echo "Bumping $chart_name appVersion from $current_app_version to $new_app_version"
              yq eval ".appVersion = \"$new_app_version\"" -i "$CHART_FILE"

              # Bump version in Chart.yaml
              current_chart_version=$(yq eval '.version' "$CHART_FILE")

              IFS='.' read -ra CHART_VERSION_PARTS <<< "$current_chart_version"
              chart_major=${CHART_VERSION_PARTS[0]}
              chart_minor=${CHART_VERSION_PARTS[1]}
              chart_patch=${CHART_VERSION_PARTS[2]}
              new_chart_patch=$((chart_patch + 1))
              new_chart_version="${chart_major}.${chart_minor}.${new_chart_patch}"

              echo "Bumping $chart_name chart version from $current_chart_version to $new_chart_version"              
              yq eval ".version = \"$new_chart_version\"" -i "$CHART_FILE"

              updated_charts="$updated_charts $chart_name"
            fi
          done

          # Set output for use in subsequent steps
          echo "updated_charts=$updated_charts" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        if: steps.bump-chart.outputs.updated_charts != ''
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          GITHUB_TOKEN: ${{ secrets.SYS_ORCH_GITHUB }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          updated_charts="${{ steps.bump-chart.outputs.updated_charts }}"

          for chart_name in $updated_charts; do
            CHART_FILE="charts/$chart_name/Chart.yaml"
            git add "$CHART_FILE"
          done

          # Create commit message with all updated charts
          if [ -n "$updated_charts" ]; then
            commit_msg="chore: bump chart versions for:$updated_charts"
            git commit -m "$commit_msg"
            git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git $BRANCH_NAME
          fi  
