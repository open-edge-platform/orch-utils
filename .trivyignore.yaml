  - id: AVD-KSV-0053
    paths:
      - "charts/adm-secret/templates/cluster-role.yaml"
    statement: pods/exec access required for vault-0 pod initialization and secret management operations

  - id: AVD-KSV-0109
    paths:
      - "**/m2m-secrets-extractor-job.yaml"
    statement: ConfigMap contains a shell script with variable references to credentials ($KEYCLOAK_PASSWORD, $M2M_CLIENTS), not actual secret values. Secrets are injected at runtime from Kubernetes Secrets.

  - id: AVD-KSV-01010
    paths:
      - "**/m2m-secrets-extractor-job.yaml"
    statement: ConfigMap contains a shell script with text references (e.g., --data-urlencode "username"), not actual sensitive values. These are command-line arguments, not stored secrets.

  - id: KSV113
    paths:
      - "**/m2m-secrets-extractor-job.yaml"
    statement: Role requires minimal secret management permissions (create, patch only) to extract M2M client secrets from Keycloak and create Kubernetes secrets for service authentication. No get/update/delete/list permissions granted.

  - id: KSV0125
    paths:
      - "**/m2m-secrets-extractor-job.yaml"
    statement: badouralix/curl-jq image from Docker Hub is a well-maintained, public image with multiple security scanners. Image is pinned to specific SHA256 digest for immutability and reproducibility.

  - id: AVD-KSV-0109
    paths:
      - "charts/adm-secret/templates/config-map.yaml"
      - "charts/keycloak-tenant-controller/templates/configmap.yaml"
      - "charts/traefik-pre/templates/jwt-plugin-configmap-generated.yaml"
    statement: ConfigMaps contain legitimate scripts and configuration templates, not actual secrets in production
  - id: AVD-KSV-0041
    paths:
      - "charts/tenancy-init/templates/serviceAccount.yaml"
    statement: Cross-namespace secret access required for tenancy initialization
  - id: AVD-KSV-0056
    paths:
      - "charts/tenancy-init/templates/serviceAccount.yaml"
    statement: Service access required for pod communication and tenancy initialization operations

  - id: AVD-KSV-0108
    paths:
      - "charts/keycloak-instance/templates/service-alias.yaml"
    statement: ExternalName service type is used (not externalIPs). Not vulnerable to CVE-2020-8554. Safe DNS alias for keycloak-system/platform-keycloak.

  - id: AVD-KSV-0056
    paths:
      - "charts/keycloak-operator/templates/rbac-and-service.yaml"
    statement: Official Keycloak Operator v26.4.5 RBAC permissions. Required for operator to manage services, ingresses, and network policies. Scoped to keycloak-system namespace via RoleBinding. Acceptable risk in controlled K8s environments with admission controls.

  - id: AVD-KSV-0113
    paths:
      - "charts/keycloak-instance/templates/rbac-config.yaml"
    statement: Secret access limited to specific resourceNames (platform-keycloak, orch-database-postgresql). Required for Keycloak Operator to access configuration and database credentials. Read-only verbs (get, watch). Scoped to orch-platform namespace.

  - id: AVD-KSV-0048
    paths:
      - "charts/keycloak-operator/templates/rbac-and-service.yaml"
    statement: Official Keycloak Operator v26.4.5 RBAC permissions. Operator requires create/update/patch/delete on statefulsets and jobs to manage Keycloak pod lifecycle and configuration jobs. Limited to keycloak-system namespace via RoleBinding. Acceptable risk in controlled K8s environments.

  - id: AVD-KSV-0113
    paths:
      - "charts/keycloak-operator/templates/rbac-and-service.yaml"
    statement: Official Keycloak Operator v26.4.5 RBAC permissions. Operator requires secret access to read bootstrap admin credentials and manage Keycloak configuration. Scoped to keycloak-system namespace via RoleBinding. Acceptable risk in controlled K8s environments.

