    Listproject.Project:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/project.Project.List'
      description: Response returned back after getting project.Project objects
    NotFoundResponse:
      content:
        application/json:
          schema:
            properties:
              message:
                type: string
      description: Not Found
