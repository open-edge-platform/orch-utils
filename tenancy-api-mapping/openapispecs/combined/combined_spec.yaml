      description: Internal Server Error
    500-InternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: The provider is currently unable to handle the request due to an internal error
    501-NotImplemented:
      content:
        application/json:
          schema:
