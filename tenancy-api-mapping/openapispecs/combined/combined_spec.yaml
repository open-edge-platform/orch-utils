            - STATUS_CONDITION_PROVISIONING
            - STATUS_CONDITION_REMOVING
          format: enum
          type: string
        reason:
          type: string
        timestamp:
          type: string
      type: object
    StoredMetadata:
      description: StoredMetadata represents all stored metadata values for a given key.
      properties:
