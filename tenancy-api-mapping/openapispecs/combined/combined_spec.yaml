          maxItems: 100
          title: metadata
          type: array
        name:
          description: The host name.
          maxLength: 50
          pattern: '^$|^[a-zA-Z-_0-9./: ]+$'
          title: name
          type: string
        note:
          description: The note associated with the host.
          maxLength: 512
          minLength: 1
          pattern: ^$|^[a-zA-Z-_0-9./:;=@?!#,<>*()" ]+$
          readOnly: true
          title: note
          type: string
