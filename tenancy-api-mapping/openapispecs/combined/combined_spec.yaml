          description: The duration in seconds of the repeated schedule, per schedule.
          format: int32
          maximum: 86400
          minimum: 1
          title: duration_seconds
          type: integer
        name:
          description: The schedule's name.
          maxLength: 50
          pattern: '^$|^[a-zA-Z-_0-9./: ]+$'
          title: name
          type: string
        repeatedScheduleID:
