      description: Request used to create Status subresource of project.Project
  responses:
    "400":
      content:
        application/json:
          example:
            code: 400
            message: Bad Request
          schema:
            $ref: '#/components/schemas/HttpError'
      description: Bad Request
    400-BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Object in payload is not properly formulated or not related to the method.
    401-Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Authentication information is missing or invalid.
    "404":
      content:
        application/json:
          example:
            code: 404
            message: Not Found
          schema:
            $ref: '#/components/schemas/HttpError'
      description: Not Found
    404-NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: No resource is found at the URI.
    "409":
      content:
        application/json:
          example:
            code: 409
            message: Conflict
          schema:
            $ref: '#/components/schemas/HttpError'
      description: Conflict
    409-Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: Request could not be processed in the current state of the resource.
    "415":
      content:
        application/json:
          example:
            code: 415
            message: Unsupported Media Type
          schema:
            $ref: '#/components/schemas/HttpError'
      description: Unsupported Media Type
    "500":
      content:
        application/json:
          example:
            code: 500
            message: Internal Server Error
          schema:
            $ref: '#/components/schemas/HttpError'
      description: Internal Server Error
    500-InternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: The provider is currently unable to handle the request due to an internal error
    501-NotImplemented:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
      description: The requested operation is not implemented.
    "503":
      content:
        application/json:
          example:
            code: 503
            message: Server Unavailable
          schema:
            $ref: '#/components/schemas/HttpError'
      description: Service Unavailable
    DefaultResponse:
      content:
        application/json:
          schema:
