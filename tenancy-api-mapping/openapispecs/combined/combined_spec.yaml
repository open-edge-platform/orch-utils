      description: Response returned back after getting project.Project objects
    Getproject.Project.SingleLink:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/project.Project.SingleLink'
      description: Response returned back after getting project.Project objects
    Getproject.Project.Status:
      content:
        application/json:
