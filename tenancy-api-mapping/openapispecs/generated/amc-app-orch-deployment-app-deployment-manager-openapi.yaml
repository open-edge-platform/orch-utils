openapi: 3.0.3
info:
  title: Application Deployment Manager API
  description: Application Deployment Manager service providing operations for deploying and managing applications
  version: 2.0.0
servers:
  - url: '{apiRoot}'
    variables:
      apiRoot:
        default: https://<multitenancy-gateway-host>
security:
  - BearerAuth: []
paths:
  /v1/projects/{projectName}/appdeployment/clusters:
    get:
      description: Gets a list of all cluster objects.
      operationId: deployment.v1.ClusterService.ListClusters
      parameters:
        - description: |-
            Optional. A string array that filters cluster labels to be
             displayed ie color=blue,customer=intel. Labels separated by a comma.
          in: query
          name: labels
          schema:
            description: |-
              (OPTIONAL) Optional. A string array that filters cluster labels to be
               displayed ie color=blue,customer=intel. Labels separated by a comma.
            items:
              description: '(OPTIONAL) '
              type: string
            maxItems: 100
            title: labels
            type: array
        - description: Optional. Select field and order based on which cluster list will be sorted.
          in: query
          name: orderBy
          schema:
            description: (OPTIONAL) Optional. Select field and order based on which cluster list will be sorted.
            title: order_by
            type: string
        - description: Optional. Selection criteria to list clusters.
          in: query
          name: filter
          schema:
            description: (OPTIONAL) Optional. Selection criteria to list clusters.
            title: filter
            type: string
        - description: Optional. Select count of clusters to be listed per page.
          in: query
          name: pageSize
          schema:
            description: (OPTIONAL) Optional. Select count of clusters to be listed per page.
            format: int32
            maximum: 500
            minimum: 0
            title: page_size
            type: integer
        - description: |-
            Optional. Offset is used to select the correct page from which clusters list will be displayed.
             (E.g If there are 10 clusters, page size is 2 and offset is set as 4, then the response will display clusters 5 and 6).
          in: query
          name: offset
          schema:
            description: |-
              (OPTIONAL) Optional. Offset is used to select the correct page from which clusters list will be displayed.
               (E.g If there are 10 clusters, page size is 2 and offset is set as 4, then the response will display clusters 5 and 6).
            format: int32
            minimum: 0
            title: offset
            type: integer
        - description: unique projectName for the resource
          in: path
          name: projectName
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deployment.v1.ListClustersResponse'
          description: Success
      summary: ListClusters
      tags:
        - deployment.v1.ClusterService
  /v1/projects/{projectName}/appdeployment/deployments:
    get:
      description: Gets a list of all deployment objects.
      operationId: deployment.v1.DeploymentService.ListDeployments
      parameters:
        - description: |-
            Optional. A string array that filters cluster labels to be
             displayed ie color=blue,customer=intel-corp. Labels separated by a comma.
          in: query
          name: labels
          schema:
            description: |-
              (OPTIONAL) Optional. A string array that filters cluster labels to be
               displayed ie color=blue,customer=intel-corp. Labels separated by a comma.
            items:
              description: '(OPTIONAL) '
              maxItems: 20
              maxLength: 200
              minLength: 1
              pattern: (^$)|^[a-z0-9]([-_.=,/a-z0-9]{0,198}[a-z0-9])?$
              type: string
            maxItems: 20
            title: labels
            type: array
        - description: Optional. Select field and order based on which Deployment list will be sorted.
          in: query
          name: orderBy
          schema:
            description: (OPTIONAL) Optional. Select field and order based on which Deployment list will be sorted.
            title: order_by
            type: string
        - description: Optional. Selection criteria to list Deployments.
          in: query
          name: filter
          schema:
            description: (OPTIONAL) Optional. Selection criteria to list Deployments.
            title: filter
            type: string
        - description: Optional. Select count of Deployment to be listed per page.
          in: query
          name: pageSize
          schema:
            description: (OPTIONAL) Optional. Select count of Deployment to be listed per page.
            format: int32
            maximum: 500
            minimum: 0
            title: page_size
            type: integer
        - description: |-
            Optional. Offset is used to select the correct page from which Deployment list will be displayed.
             (E.g If there are 10 Deployments, page size is 2 and offset is set as 4, then the response will display Deployment 5 and 6.)
          in: query
          name: offset
          schema:
            description: |-
              (OPTIONAL) Optional. Offset is used to select the correct page from which Deployment list will be displayed.
               (E.g If there are 10 Deployments, page size is 2 and offset is set as 4, then the response will display Deployment 5 and 6.)
            format: int32
            minimum: 0
            title: offset
            type: integer
        - description: unique projectName for the resource
          in: path
          name: projectName
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deployment.v1.ListDeploymentsResponse'
          description: Success
      summary: ListDeployments
      tags:
        - deployment.v1.DeploymentService
    post:
      description: Creates a deployment object.
      operationId: deployment.v1.DeploymentService.CreateDeployment
      parameters:
        - description: unique projectName for the resource
          in: path
          name: projectName
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/deployment.v1.Deployment'
        description: Required. Initial values for the deployment.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deployment.v1.CreateDeploymentResponse'
          description: Success
      summary: CreateDeployment
      tags:
        - deployment.v1.DeploymentService
  /v1/projects/{projectName}/summary/deployments_status:
    get:
      description: Gets all deployment clusters count status.
      operationId: deployment.v1.DeploymentService.GetDeploymentsStatus
      parameters:
        - description: |-
            Optional. A string array that filters cluster labels to be
             displayed ie color=blue,customer=intel-corp. Labels separated by a comma.
          in: query
          name: labels
          schema:
            description: |-
              (OPTIONAL) Optional. A string array that filters cluster labels to be
               displayed ie color=blue,customer=intel-corp. Labels separated by a comma.
            items:
              description: '(OPTIONAL) '
              maxItems: 20
              maxLength: 200
              minLength: 1
              pattern: (^$)|^[a-z0-9]([-_.=,/a-z0-9]{0,198}[a-z0-9])?$
              type: string
            maxItems: 20
            title: labels
            type: array
        - description: unique projectName for the resource
          in: path
          name: projectName
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/deployment.v1.GetDeploymentsStatusResponse'
          description: Success
      summary: GetDeploymentsStatus
      tags:
        - deployment.v1.DeploymentService
components:
  schemas:
    connect-protocol-version:
      description: Define the version of the Connect protocol
      enum:
        - 1
      title: Connect-Protocol-Version
      type: number
    connect-timeout-header:
      description: Define the timeout, in ms
      title: Connect-Timeout-Ms
      type: number
    connect.error:
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
      properties:
        code:
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          example: not_found
          type: string
        details:
          description: A list of messages that carry the error details. There is no limit on the number of messages.
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          maxItems: 100
          type: array
        message:
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
          type: string
      title: Connect Error
      type: object
    connect.error_details.Any:
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
      properties:
        debug:
          additionalProperties: true
          description: Detailed error information.
          title: Any
          type: object
        type:
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
          type: string
        value:
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
          format: binary
          type: string
      type: object
    deployment.v1.App:
      additionalProperties: false
      description: Details of application.
      properties:
        id:
          description: |-
            Id of the app (same as Fleet bundle name) which is,
             concatenated from name and deploy_id (uid which comes from k8s).
          readOnly: true
          title: id
          type: string
        name:
          description: The deployment package app name.
          readOnly: true
          title: name
          type: string
        status:
          $ref: '#/components/schemas/deployment.v1.Deployment.Status'
      title: App
      type: object
    deployment.v1.Cluster:
      additionalProperties: false
      description: Details of cluster.
      properties:
        apps:
          description: Apps has per-app details.
          items:
            $ref: '#/components/schemas/deployment.v1.App'
          maxItems: 100
          readOnly: true
          title: apps
          type: array
        id:
          description: ID is the cluster id which ECM generates and assigns to the Rancher cluster name.
          readOnly: true
          title: id
          type: string
        name:
          description: Name is the display name which user provides and ECM creates and assigns clustername label to Fleet cluster object.
          readOnly: true
          title: name
          type: string
        status:
          $ref: '#/components/schemas/deployment.v1.Deployment.Status'
      title: Cluster
      type: object
    deployment.v1.ClusterInfo:
      additionalProperties: false
      description: Cluster defines the message for the Cluster object.
      properties:
        createTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        id:
          description: ID is the cluster id which ECM generates and assigns to the Rancher cluster name.
          readOnly: true
          title: id
          type: string
        labels:
          additionalProperties:
            title: value
            type: string
          description: List of cluster labels retrieved from Fleet cluster object.
          readOnly: true
          title: labels
          type: object
        name:
          description: Name is the display name which user provides and ECM creates and assigns clustername label to Fleet cluster object.
          readOnly: true
          title: name
          type: string
      title: ClusterInfo
      type: object
    deployment.v1.ClusterInfo.LabelsEntry:
      additionalProperties: false
      properties:
        key:
          title: key
          type: string
        value:
          title: value
          type: string
      title: LabelsEntry
      type: object
    deployment.v1.CreateDeploymentRequest:
      additionalProperties: false
      description: Request message for the CreateDeployment method.
      properties:
        deployment:
          $ref: '#/components/schemas/deployment.v1.Deployment'
      required:
        - deployment
      title: CreateDeploymentRequest
      type: object
    deployment.v1.CreateDeploymentResponse:
      additionalProperties: false
      description: Response message for the CreateDeployment method.
      properties:
        deploymentId:
          description: Returns the new Deployment Id.
          maxLength: 40
          minLength: 1
          title: deployment_id
          type: string
      required:
        - deploymentId
      title: CreateDeploymentResponse
      type: object
    deployment.v1.DeleteDeploymentRequest:
      additionalProperties: false
      description: Request message for the DeleteDeployment method.
      properties:
        deleteType:
          $ref: '#/components/schemas/deployment.v1.DeleteType'
        deplId:
          description: Required. The id of the deployment to delete.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: depl_id
          type: string
      required:
        - deplId
        - deleteType
      title: DeleteDeploymentRequest
      type: object
    deployment.v1.DeleteType:
      description: |-
        Different delete types to handle parent and child
         lists, for dependency support. Available options: PARENT_ONLY, ALL.
      enum:
        - PARENT_ONLY
        - ALL
      title: DeleteType
      type: string
    deployment.v1.Deployment:
      additionalProperties: false
      description: Deployment defines the specification to deploy a Deployment Package onto a set of clusters.
      properties:
        allAppTargetClusters:
          $ref: '#/components/schemas/deployment.v1.TargetClusters'
        appName:
          description: The deployment package name to deploy from the catalog.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: app_name
          type: string
        appVersion:
          description: The version of the deployment package.
          maxLength: 20
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-.]{0,18}[a-z0-9]{0,1}$
          title: app_version
          type: string
        apps:
          description: Application details.
          items:
            $ref: '#/components/schemas/deployment.v1.App'
          maxItems: 100
          readOnly: true
          title: apps
          type: array
        createTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        deployId:
          description: The id of the deployment.
          readOnly: true
          title: deploy_id
          type: string
        deploymentType:
          description: |-
            (OPTIONAL) The deployment type for the target cluster deployment can be either auto-scaling or targeted.
             In Auto-scaling type, the application will be automatically deployed on all the
             clusters which match the Target cluster label. In Targeted type, the user has to select among pre created
             clusters to deploy the application.
          maxLength: 20
          pattern: ^[a-z0-9]*[a-z0-9-]{0,18}[a-z0-9]{0,1}$
          title: deployment_type
          type: string
        displayName:
          description: (OPTIONAL) Deployment display name.
          maxLength: 40
          pattern: ^([a-zA-Z0-9][\w\- \.\/_]{0,38}[a-zA-Z0-9]{0,1}|)$
          title: display_name
          type: string
        name:
          description: Deployment name (unique string assigned by Orchestrator).
          readOnly: true
          title: name
          type: string
        networkName:
          description: (OPTIONAL) network_name is the name of the interconnect network that deployment be part of
          maxLength: 40
          pattern: ^[a-z0-9]*[a-z0-9-]{0,18}[a-z0-9]{0,1}$
          title: network_name
          type: string
        overrideValues:
          description: (OPTIONAL) The Override values can be used to override any of the base profile values based on Deployment scenario.
          items:
            $ref: '#/components/schemas/deployment.v1.OverrideValues'
          maxItems: 100
          title: override_values
          type: array
        profileName:
          description: (OPTIONAL) The selected profile name to be used for the base Helm values of the different applications in the deployment package
          maxLength: 40
          pattern: ^[a-z0-9]*[a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: profile_name
          type: string
        serviceExports:
          description: '(OPTIONAL) '
          items:
            $ref: '#/components/schemas/deployment.v1.ServiceExport'
          maxItems: 10
          title: service_exports
          type: array
        status:
          $ref: '#/components/schemas/deployment.v1.Deployment.Status'
        targetClusters:
          description: (OPTIONAL) Cluster labels on which we want to deploy the application.
          items:
            $ref: '#/components/schemas/deployment.v1.TargetClusters'
          maxItems: 50
          title: target_clusters
          type: array
      required:
        - appName
        - appVersion
      title: Deployment
      type: object
    deployment.v1.Deployment.Status:
      additionalProperties: false
      description: Status has details of the deployment.
      properties:
        message:
          readOnly: true
          title: message
          type: string
        state:
          $ref: '#/components/schemas/deployment.v1.State'
        summary:
          $ref: '#/components/schemas/deployment.v1.Summary'
      title: Status
      type: object
    deployment.v1.DeploymentInstancesCluster:
      additionalProperties: false
      properties:
        apps:
          description: Apps has per-app details.
          items:
            $ref: '#/components/schemas/deployment.v1.App'
          maxItems: 100
          readOnly: true
          title: apps
          type: array
        deploymentDisplayName:
          description: (OPTIONAL) Deployment display name.
          maxLength: 40
          pattern: ^([a-zA-Z0-9][\w\- \.\/_]{0,38}[a-zA-Z0-9]{0,1}|)$
          title: deployment_display_name
          type: string
        deploymentName:
          description: Deployment name (unique string assigned by Orchestrator).
          readOnly: true
          title: deployment_name
          type: string
        deploymentUid:
          description: Deployment CR UID.
          readOnly: true
          title: deployment_uid
          type: string
        status:
          $ref: '#/components/schemas/deployment.v1.Deployment.Status'
      title: DeploymentInstancesCluster
      type: object
    deployment.v1.GetAppNamespaceRequest:
      additionalProperties: false
      description: Request message for the GetappNamespace method.
      properties:
        appId:
          maxLength: 80
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,78}[a-z0-9]{0,1}$
          title: app_id
          type: string
      required:
        - appId
      title: GetAppNamespaceRequest
      type: object
    deployment.v1.GetAppNamespaceResponse:
      additionalProperties: false
      description: Response message for the GetappNamespace method.
      properties:
        namespace:
          title: namespace
          type: string
      required:
        - namespace
      title: GetAppNamespaceResponse
      type: object
    deployment.v1.GetClusterRequest:
      additionalProperties: false
      description: Request message for GetCluster method.
      properties:
        clusterId:
          description: Required. The id of the cluster.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: cluster_id
          type: string
      required:
        - clusterId
      title: GetClusterRequest
      type: object
    deployment.v1.GetClusterResponse:
      additionalProperties: false
      description: Response message for GetCluster method.
      properties:
        cluster:
          $ref: '#/components/schemas/deployment.v1.Cluster'
      title: GetClusterResponse
      type: object
    deployment.v1.GetDeploymentRequest:
      additionalProperties: false
      description: Request message for the GetDeployment method.
      properties:
        deplId:
          description: Required. The id of the deployment to get.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: depl_id
          type: string
      required:
        - deplId
      title: GetDeploymentRequest
      type: object
    deployment.v1.GetDeploymentResponse:
      additionalProperties: false
      description: Response message for the GetDeployment method.
      properties:
        deployment:
          $ref: '#/components/schemas/deployment.v1.Deployment'
      required:
        - deployment
      title: GetDeploymentResponse
      type: object
    deployment.v1.GetDeploymentsStatusRequest:
      additionalProperties: false
      description: Request message for the GetDeploymentsStatus method.
      properties:
        labels:
          description: |-
            (OPTIONAL) Optional. A string array that filters cluster labels to be
             displayed ie color=blue,customer=intel-corp. Labels separated by a comma.
          items:
            description: '(OPTIONAL) '
            maxItems: 20
            maxLength: 200
            minLength: 1
            pattern: (^$)|^[a-z0-9]([-_.=,/a-z0-9]{0,198}[a-z0-9])?$
            type: string
          maxItems: 20
          title: labels
          type: array
      title: GetDeploymentsStatusRequest
      type: object
    deployment.v1.GetDeploymentsStatusResponse:
      additionalProperties: false
      description: Response message for the GetDeploymentsStatus method.
      properties:
        deploying:
          format: int32
          minimum: 0
          readOnly: true
          title: deploying
          type: integer
        down:
          format: int32
          minimum: 0
          readOnly: true
          title: down
          type: integer
        error:
          format: int32
          minimum: 0
          readOnly: true
          title: error
          type: integer
        running:
          format: int32
          minimum: 0
          readOnly: true
          title: running
          type: integer
        terminating:
          format: int32
          minimum: 0
          readOnly: true
          title: terminating
          type: integer
        total:
          format: int32
          minimum: 0
          readOnly: true
          title: total
          type: integer
        unknown:
          format: int32
          minimum: 0
          readOnly: true
          title: unknown
          type: integer
        updating:
          format: int32
          minimum: 0
          readOnly: true
          title: updating
          type: integer
      title: GetDeploymentsStatusResponse
      type: object
    deployment.v1.GetKubeConfigRequest:
      additionalProperties: false
      description: Request message for Get KubeConfig method
      properties:
        clusterId:
          description: Required. The cluster id for the kubeconfig.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: cluster_id
          type: string
      required:
        - clusterId
      title: GetKubeConfigRequest
      type: object
    deployment.v1.GetKubeConfigResponse:
      additionalProperties: false
      description: Response message for Get KubeConfig method
      properties:
        kubeConfigInfo:
          $ref: '#/components/schemas/deployment.v1.KubeConfigInfo'
      title: GetKubeConfigResponse
      type: object
    deployment.v1.KubeConfigInfo:
      additionalProperties: false
      properties:
        kubeConfig:
          format: byte
          readOnly: true
          title: kube_config
          type: string
      title: KubeConfigInfo
      type: object
    deployment.v1.ListClustersRequest:
      additionalProperties: false
      description: Request message for the ListClusters method.
      properties:
        filter:
          description: (OPTIONAL) Optional. Selection criteria to list clusters.
          title: filter
          type: string
        labels:
          description: |-
            (OPTIONAL) Optional. A string array that filters cluster labels to be
             displayed ie color=blue,customer=intel. Labels separated by a comma.
          items:
            description: '(OPTIONAL) '
            type: string
          maxItems: 100
          title: labels
          type: array
        offset:
          description: |-
            (OPTIONAL) Optional. Offset is used to select the correct page from which clusters list will be displayed.
             (E.g If there are 10 clusters, page size is 2 and offset is set as 4, then the response will display clusters 5 and 6).
          format: int32
          minimum: 0
          title: offset
          type: integer
        orderBy:
          description: (OPTIONAL) Optional. Select field and order based on which cluster list will be sorted.
          title: order_by
          type: string
        pageSize:
          description: (OPTIONAL) Optional. Select count of clusters to be listed per page.
          format: int32
          maximum: 500
          minimum: 0
          title: page_size
          type: integer
      title: ListClustersRequest
      type: object
    deployment.v1.ListClustersResponse:
      additionalProperties: false
      description: Response message for the ListClusters method.
      properties:
        clusters:
          description: A list of Cluster Objects.
          items:
            $ref: '#/components/schemas/deployment.v1.ClusterInfo'
          maxItems: 500
          title: clusters
          type: array
        totalElements:
          format: int32
          title: total_elements
          type: integer
      required:
        - clusters
        - totalElements
      title: ListClustersResponse
      type: object
    deployment.v1.ListDeploymentClustersRequest:
      additionalProperties: false
      description: Request message for ListDeploymentClusters method.
      properties:
        deplId:
          description: Required. The id of the deployment to get.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: depl_id
          type: string
        filter:
          description: (OPTIONAL) Optional. Selection criteria to list Deployment clusters.
          title: filter
          type: string
        offset:
          description: |-
            (OPTIONAL) Optional. Offset is used to select the correct page from which Deployment clusters list will be displayed.
             (E.g If there are 10 Deployment clusters, page size is 2 and offset is set as 4, then the response will display Deployment clusters 5 and 6.)
          format: int32
          title: offset
          type: integer
        orderBy:
          description: (OPTIONAL) Optional. Select field and order based on which Deployment cluster list will be sorted.
          title: order_by
          type: string
        pageSize:
