             profiles of a given package. It is used for display purposes on user interfaces.
          maxLength: 40
          pattern: ^\PC*$
          title: display_name
          type: string
        name:
          description: |-
            Name is a human-readable unique identifier for the profile and must be unique for all profiles of a
             given deployment package.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: name
          type: string
        updateTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      required:
        - name
        - applicationProfiles
      title: DeploymentProfile
      type: object
    catalog.v3.DeploymentRequirement:
      additionalProperties: false
      description: |-
        DeploymentRequirement is a reference to the deployment package that must be deployed first,
         as a requirement for an application to be deployed.
      properties:
        deploymentProfileName:
          description: (OPTIONAL) Optional name of the deployment profile to be used. When not provided, the default deployment profile will be used.
          title: deployment_profile_name
          type: string
        name:
          description: Name of the required deployment package.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: name
          type: string
        version:
          description: Version of the required deployment package.
          maxLength: 20
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-.]{0,18}[a-z0-9]{0,1}$
          title: version
          type: string
      required:
        - name
        - version
      title: DeploymentRequirement
      type: object
    catalog.v3.Endpoint:
      additionalProperties: false
      description: Endpoint represents an application service endpoint.
      properties:
        appName:
          description: (OPTIONAL) The name of the application providing this endpoint.
          maxLength: 40
          title: app_name
          type: string
        authType:
          description: Authentication type expected by the endpoint.
          maxLength: 16
          pattern: ^[a-z]{0,16}$
          title: auth_type
          type: string
        externalPath:
          description: Externally accessible path to the endpoint.
          maxLength: 128
          minLength: 1
          title: external_path
          type: string
        internalPath:
          description: Internally accessible path to the endpoint.
          maxLength: 128
          minLength: 1
          title: internal_path
          type: string
        scheme:
          description: Protocol scheme provided by the endpoint.
          maxLength: 32
          pattern: ^([a-z][a-z0-9-]{0,30}[a-z0-9]){0,1}$
          title: scheme
          type: string
        serviceName:
          description: The name of the service hosted by the endpoint.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: service_name
          type: string
      required:
        - serviceName
        - externalPath
        - internalPath
        - scheme
        - authType
      title: Endpoint
      type: object
    catalog.v3.Event:
      additionalProperties: false
      description: |-
        Event message carries the event type detected by the catalog service during the invocation of
         the "watch" RPC.
      properties:
        projectId:
          description: ID of the project to which the subject belongs.
          title: project_id
          type: string
        type:
          description: |-
            Type field specifies whether an entity was created, updated, or deleted. The replayed type is used
             to annotate entities during the replay phase of the watch RPC.
          maxLength: 7
          minLength: 7
          pattern: ^(replayed)$|^(created)$|^(updated)$|^(deleted)$
          title: type
          type: string
      required:
        - type
        - projectId
      title: Event
      type: object
    catalog.v3.Kind:
      description: Kind designation for applications and packages, normal (unspecified), extension, or addon.
      enum:
        - KIND_UNSPECIFIED
        - KIND_NORMAL
        - KIND_EXTENSION
        - KIND_ADDON
      title: Kind
      type: string
    catalog.v3.Namespace:
      additionalProperties: false
      description: |-
        Namespace represents a complex namespace definition with predefined labels and annotations.
         They are created before any other resources in the deployment.
      properties:
        annotations:
          additionalProperties:
            title: value
            type: string
          description: '(OPTIONAL) '
          title: annotations
          type: object
        labels:
          additionalProperties:
            title: value
            type: string
          description: '(OPTIONAL) '
          title: labels
          type: object
        name:
          description: |-
            namespace names must be valid RFC 1123 DNS labels.
             Avoid creating namespaces with the prefix `kube-`, since it is reserved for Kubernetes\* system namespaces.
             Avoid `default` - will already exist
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: name
          type: string
      required:
        - name
      title: Namespace
      type: object
    catalog.v3.ParameterTemplate:
      additionalProperties: false
      description: ParameterTemplate describes override values for Helm chart values
      properties:
        default:
          description: (OPTIONAL) Default value for the parameter.
          maxLength: 4096
          title: default
          type: string
        displayName:
          description: (OPTIONAL) Display name is an optional human-readable name for the template. It is used for display purposes on user interfaces.
          maxLength: 100
          pattern: ^\PC*$
          title: display_name
          type: string
        mandatory:
          description: (OPTIONAL) Optional mandatory flag for the parameter.
          title: mandatory
          type: boolean
        name:
          description: Human-readable name for the parameter template.
          maxLength: 4096
          minLength: 1
          pattern: ^[A-Za-z0-9-/_\[\]\.\\]*$
          title: name
          type: string
        secret:
          description: (OPTIONAL) Optional secret flag for the parameter.
          title: secret
          type: boolean
        suggestedValues:
          description: (OPTIONAL) List of suggested values to use, to override the default value.
          items:
            description: '(OPTIONAL) '
            maxItems: 100
            maxLength: 4096
            minLength: 1
            type: string
            uniqueItems: true
          maxItems: 100
          title: suggested_values
          type: array
          uniqueItems: true
        type:
          description: 'Type of parameter: string, number, or boolean.'
          minLength: 1
          pattern: ^(string)$|^(number)$|^(boolean)$
          title: type
          type: string
        validator:
          description: (OPTIONAL) Optional validator for the parameter. Usage TBD.
          maxLength: 40
          title: validator
          type: string
      required:
        - name
        - type
      title: ParameterTemplate
      type: object
    catalog.v3.Profile:
      additionalProperties: false
      description: Profile is a set of configuration values for customizing application deployment.
      properties:
        chartValues:
          description: (OPTIONAL) Raw byte value containing the chart values as raw YAML bytes.
          maxLength: 4000000
          title: chart_values
          type: string
        createTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        deploymentRequirement:
          description: (OPTIONAL) List of deployment requirements for this profile.
          items:
            $ref: '#/components/schemas/catalog.v3.DeploymentRequirement'
          maxItems: 100
          title: deployment_requirement
          type: array
        description:
          description: (OPTIONAL) Description of the profile. Displayed on user interfaces.
          maxLength: 1000
          title: description
          type: string
        displayName:
          description: |-
            (OPTIONAL) Display name is an optional human-readable name for the profile. When specified, it must be unique among all
             profiles of a given application. It is used for display purposes on user interfaces.
          maxLength: 40
          pattern: ^\PC*$
          title: display_name
          type: string
        name:
          description: Human-readable name for the profile. Unique among all profiles of the same application.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: name
          type: string
        parameterTemplates:
          description: (OPTIONAL) Parameter templates available for this profile.
          items:
            $ref: '#/components/schemas/catalog.v3.ParameterTemplate'
          maxItems: 100
          title: parameter_templates
          type: array
        updateTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
      required:
        - name
      title: Profile
      type: object
    catalog.v3.Registry:
      additionalProperties: false
      description: |-
        Registry represents a repository from which various artifacts, such as application Docker\* images or Helm\* charts
         can be retrieved. As such, the registry entity holds information used for finding and accessing the represented repository.
      properties:
        apiType:
          description: (OPTIONAL) Optional type of the API used to obtain inventory of the articles hosted by the registry.
          maxLength: 16
          pattern: ^\PC*$
          title: api_type
          type: string
        authToken:
          description: Optional authentication token or password for accessing the registry.
          maxLength: 4500
          pattern: ^\PC*$
          title: auth_token
          type: string
        cacerts:
          description: (OPTIONAL) Optional CA certificates for accessing the registry using secure channels, such as HTTPS.
          maxLength: 16384
          title: cacerts
          type: string
        createTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        description:
          description: (OPTIONAL) Description of the registry. Displayed on user interfaces.
          maxLength: 1000
          title: description
          type: string
        displayName:
          description: |-
            (OPTIONAL) Display name is an optional human-readable name for the registry. When specified, it must be unique among all
             registries within a project. It is used for display purposes on user interfaces.
          maxLength: 40
          pattern: ^\PC*$
          title: display_name
          type: string
        inventoryUrl:
          description: (OPTIONAL) Optional URL of the API for accessing inventory of artifacts hosted by the registry.
          maxLength: 1000
          title: inventory_url
          type: string
        name:
          description: |-
            Name is a human-readable unique identifier for the registry and must be unique for all registries of a
             given project.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: name
          type: string
        rootUrl:
          description: Root URL for retrieving artifacts, e.g. Docker images and Helm charts, from the registry.
          maxLength: 1000
          minLength: 1
          pattern: ^(https?|oci)://[a-z0-9-]+(.[a-z0-9-]+)+([/?][\w_\-@:%.+~#?&/=]*)?$
          title: root_url
          type: string
        type:
          description: Type indicates whether the registry holds Docker images or Helm charts; defaults to Helm charts.
          maxLength: 40
          minLength: 1
          pattern: ^(HELM)$|^(IMAGE)$
          title: type
          type: string
        updateTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        username:
          description: Optional username for accessing the registry.
          maxLength: 1000
          pattern: ^\PC*$
          title: username
          type: string
      required:
        - name
        - rootUrl
        - type
      title: Registry
      type: object
    catalog.v3.ResourceReference:
      additionalProperties: false
      description: ResourceReference represents a Kubernetes resource identifier.
      properties:
        ignore:
          description: (OPTIONAL) Ignore whole resource if true. Will use "remove" if false or not present.
          title: ignore
          type: boolean
        kind:
          description: Kubernetes resource kind, e.g. ConfigMap.
          maxLength: 40
          minLength: 1
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,38}[a-zA-Z0-9]{0,1}$
          title: kind
          type: string
        name:
          description: Kubernetes resource name.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-._-]{0,38}[a-z0-9]{0,1}$
          title: name
          type: string
        namespace:
          description: (OPTIONAL) Kubernetes namespace where the ignored resource resides. When empty, the application namespace will be used.
          title: namespace
          type: string
      required:
        - name
        - kind
      title: ResourceReference
      type: object
    catalog.v3.UIExtension:
      additionalProperties: false
      description: UIExtension is an augmentation of an API extension.
      properties:
        appName:
          description: The name of the application corresponding to this UI extension.
          maxLength: 40
          minLength: 1
          title: app_name
          type: string
        description:
          description: Description of the API extension, used on the main UI dashboard.
          maxLength: 1000
          minLength: 1
          title: description
          type: string
        fileName:
          description: The name of the main file to load this specific UI extension.
          maxLength: 40
          minLength: 1
          title: file_name
          type: string
        label:
          description: Label is a human readable text used for display in the main UI dashboard
          maxLength: 40
          pattern: ^\PC*$
          title: label
          type: string
        moduleName:
          description: Name of the application module to be loaded.
          maxLength: 40
          minLength: 1
          title: module_name
          type: string
        serviceName:
          description: The name of the API extension endpoint.
          maxLength: 40
          minLength: 1
          title: service_name
          type: string
      required:
        - label
        - serviceName
        - description
        - fileName
        - appName
        - moduleName
      title: UIExtension
      type: object
    catalog.v3.Upload:
      additionalProperties: false
      description: Upload represents a single file-upload record.
      properties:
        artifact:
          description: Raw bytes content of the file being uploaded.
          format: byte
          title: artifact
          type: string
        fileName:
          description: Name of the file being uploaded.
          title: file_name
          type: string
      required:
        - fileName
        - artifact
      title: Upload
      type: object
    catalog.v3.UploadCatalogEntitiesResponse:
      additionalProperties: false
      description: Response message for the UploadCatalogItems method
      properties:
        errorMessages:
          description: Any error messages encountered either during YAML parsing or entity creation or update.
          items:
            maxItems: 100
            type: string
          maxItems: 100
          title: error_messages
          type: array
        sessionId:
          description: Session ID, generated by the server after the first upload request has been processed.
          title: session_id
          type: string
        uploadNumber:
          description: 'Deprecated: Next expected upload number or total number of uploads on the last upload request.'
          title: upload_number
          type: integer
      required:
        - sessionId
        - uploadNumber
      title: UploadCatalogEntitiesResponse
      type: object
    clusterNetwork:
      description: Cluster network configuration, including pod and service CIDR blocks.
      properties:
        pods:
          $ref: '#/components/schemas/NetworkRanges'
        services:
          $ref: '#/components/schemas/NetworkRanges'
      type: object
    connect-protocol-version:
      description: Define the version of the Connect protocol
      enum:
        - 1
      title: Connect-Protocol-Version
      type: number
    connect-timeout-header:
      description: Define the timeout, in ms
      title: Connect-Timeout-Ms
      type: number
    connect.error:
      additionalProperties: true
      description: 'Error type returned by Connect: https://connectrpc.com/docs/go/errors/#http-representation'
      properties:
        code:
          description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
          enum:
            - canceled
            - unknown
            - invalid_argument
            - deadline_exceeded
            - not_found
            - already_exists
            - permission_denied
            - resource_exhausted
            - failed_precondition
            - aborted
            - out_of_range
            - unimplemented
            - internal
            - unavailable
            - data_loss
            - unauthenticated
          example: not_found
          type: string
        details:
          description: A list of messages that carry the error details. There is no limit on the number of messages.
          items:
            $ref: '#/components/schemas/connect.error_details.Any'
          maxItems: 100
          type: array
        message:
          description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
          type: string
      title: Connect Error
      type: object
    connect.error_details.Any:
      additionalProperties: true
      description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message, with an additional debug field for ConnectRPC error details.
      properties:
        debug:
          additionalProperties: true
          description: Detailed error information.
          title: Any
          type: object
        type:
          description: 'A URL that acts as a globally unique identifier for the type of the serialized message. For example: `type.googleapis.com/google.rpc.ErrorInfo`. This is used to determine the schema of the data in the `value` field and is the discriminator for the `debug` field.'
          type: string
        value:
          description: The Protobuf message, serialized as bytes and base64-encoded. The specific message type is identified by the `type` field.
          format: binary
          type: string
      type: object
    deployment.v1.App:
      additionalProperties: false
      description: Details of application.
      properties:
        id:
          description: |-
            Id of the app (same as Fleet bundle name) which is,
             concatenated from name and deploy_id (uid which comes from k8s).
          readOnly: true
          title: id
          type: string
        name:
          description: The deployment package app name.
          readOnly: true
          title: name
          type: string
        status:
          $ref: '#/components/schemas/deployment.v1.Deployment.Status'
      title: App
      type: object
    deployment.v1.Cluster:
      additionalProperties: false
      description: Details of cluster.
      properties:
        apps:
          description: Apps has per-app details.
          items:
            $ref: '#/components/schemas/deployment.v1.App'
          maxItems: 100
          readOnly: true
          title: apps
          type: array
        id:
          description: ID is the cluster id which ECM generates and assigns to the Rancher cluster name.
          readOnly: true
          title: id
          type: string
        name:
          description: Name is the display name which user provides and ECM creates and assigns clustername label to Fleet cluster object.
          readOnly: true
          title: name
          type: string
        status:
          $ref: '#/components/schemas/deployment.v1.Deployment.Status'
      title: Cluster
      type: object
    deployment.v1.ClusterInfo:
      additionalProperties: false
      description: Cluster defines the message for the Cluster object.
      properties:
        createTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        id:
          description: ID is the cluster id which ECM generates and assigns to the Rancher cluster name.
          readOnly: true
          title: id
          type: string
        labels:
          additionalProperties:
            title: value
            type: string
          description: List of cluster labels retrieved from Fleet cluster object.
          readOnly: true
          title: labels
          type: object
        name:
          description: Name is the display name which user provides and ECM creates and assigns clustername label to Fleet cluster object.
          readOnly: true
          title: name
          type: string
      title: ClusterInfo
      type: object
    deployment.v1.DeleteType:
      description: |-
        Different delete types to handle parent and child
         lists, for dependency support. Available options: PARENT_ONLY, ALL.
      enum:
        - PARENT_ONLY
        - ALL
      title: DeleteType
      type: string
    deployment.v1.Deployment:
      additionalProperties: false
      description: Deployment defines the specification to deploy a Deployment Package onto a set of clusters.
      properties:
        allAppTargetClusters:
          $ref: '#/components/schemas/deployment.v1.TargetClusters'
        appName:
          description: The deployment package name to deploy from the catalog.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: app_name
          type: string
        appVersion:
          description: The version of the deployment package.
          maxLength: 20
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-.]{0,18}[a-z0-9]{0,1}$
          title: app_version
          type: string
        apps:
          description: Application details.
          items:
            $ref: '#/components/schemas/deployment.v1.App'
          maxItems: 100
          readOnly: true
          title: apps
          type: array
        createTime:
          $ref: '#/components/schemas/google.protobuf.Timestamp'
        deployId:
          description: The id of the deployment.
          readOnly: true
          title: deploy_id
          type: string
        deploymentType:
          description: |-
            (OPTIONAL) The deployment type for the target cluster deployment can be either auto-scaling or targeted.
             In Auto-scaling type, the application will be automatically deployed on all the
             clusters which match the Target cluster label. In Targeted type, the user has to select among pre created
             clusters to deploy the application.
          maxLength: 20
          pattern: ^[a-z0-9]*[a-z0-9-]{0,18}[a-z0-9]{0,1}$
          title: deployment_type
          type: string
        displayName:
          description: (OPTIONAL) Deployment display name.
          maxLength: 40
          pattern: ^([a-zA-Z0-9][\w\- \.\/_]{0,38}[a-zA-Z0-9]{0,1}|)$
          title: display_name
          type: string
        name:
          description: Deployment name (unique string assigned by Orchestrator).
          readOnly: true
          title: name
          type: string
        networkName:
          description: (OPTIONAL) network_name is the name of the interconnect network that deployment be part of
          maxLength: 40
          pattern: ^[a-z0-9]*[a-z0-9-]{0,18}[a-z0-9]{0,1}$
          title: network_name
          type: string
        overrideValues:
          description: (OPTIONAL) The Override values can be used to override any of the base profile values based on Deployment scenario.
          items:
            $ref: '#/components/schemas/deployment.v1.OverrideValues'
          maxItems: 100
          title: override_values
          type: array
        profileName:
          description: (OPTIONAL) The selected profile name to be used for the base Helm values of the different applications in the deployment package
          maxLength: 40
          pattern: ^[a-z0-9]*[a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: profile_name
          type: string
        serviceExports:
          description: '(OPTIONAL) '
          items:
            $ref: '#/components/schemas/deployment.v1.ServiceExport'
          maxItems: 10
          title: service_exports
          type: array
        status:
          $ref: '#/components/schemas/deployment.v1.Deployment.Status'
        targetClusters:
          description: (OPTIONAL) Cluster labels on which we want to deploy the application.
          items:
            $ref: '#/components/schemas/deployment.v1.TargetClusters'
          maxItems: 50
          title: target_clusters
          type: array
      required:
        - appName
        - appVersion
      title: Deployment
      type: object
    deployment.v1.Deployment.Status:
      additionalProperties: false
      description: Status has details of the deployment.
      properties:
        message:
          readOnly: true
          title: message
          type: string
        state:
          $ref: '#/components/schemas/deployment.v1.State'
        summary:
          $ref: '#/components/schemas/deployment.v1.Summary'
      title: Status
      type: object
    deployment.v1.DeploymentInstancesCluster:
      additionalProperties: false
      properties:
        apps:
          description: Apps has per-app details.
          items:
            $ref: '#/components/schemas/deployment.v1.App'
          maxItems: 100
          readOnly: true
          title: apps
          type: array
        deploymentDisplayName:
          description: (OPTIONAL) Deployment display name.
          maxLength: 40
          pattern: ^([a-zA-Z0-9][\w\- \.\/_]{0,38}[a-zA-Z0-9]{0,1}|)$
          title: deployment_display_name
          type: string
        deploymentName:
          description: Deployment name (unique string assigned by Orchestrator).
          readOnly: true
          title: deployment_name
          type: string
        deploymentUid:
          description: Deployment CR UID.
          readOnly: true
          title: deployment_uid
          type: string
        status:
          $ref: '#/components/schemas/deployment.v1.Deployment.Status'
      title: DeploymentInstancesCluster
      type: object
    deployment.v1.KubeConfigInfo:
      additionalProperties: false
      properties:
        kubeConfig:
          format: byte
          readOnly: true
          title: kube_config
          type: string
      title: KubeConfigInfo
      type: object
    deployment.v1.OverrideValues:
      additionalProperties: false
      description: |-
        The Override values can be used to override any of the base helm values of
         applications based on Deployment scenario.
      properties:
        appName:
          description: deployment package name to use when overriding values.
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: app_name
          type: string
        targetNamespace:
          description: (OPTIONAL) The namespace to deploy the app onto, default namespace is default.
          maxLength: 63
          pattern: (^$)|^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
          title: target_namespace
          type: string
        values:
          $ref: '#/components/schemas/google.protobuf.Struct'
      required:
        - appName
      title: OverrideValues
      type: object
    deployment.v1.ServiceExport:
      additionalProperties: false
      properties:
        appName:
          maxLength: 40
          minLength: 1
          pattern: ^[a-z0-9][a-z0-9-]{0,38}[a-z0-9]{0,1}$
          title: app_name
          type: string
        enabled:
          title: enabled
          type: boolean
      required:
        - appName
      title: ServiceExport
      type: object
    deployment.v1.State:
      description: State are the different states a deployment/cluster/app can be in.
      enum:
        - UNKNOWN
        - RUNNING
        - DOWN
        - INTERNAL_ERROR
        - DEPLOYING
        - UPDATING
        - TERMINATING
        - ERROR
        - NO_TARGET_CLUSTERS
      title: State
      type: string
    deployment.v1.Summary:
      additionalProperties: false
      description: Count of status.
      properties:
        down:
          description: Number of down apps/clusters in the deployment.
          format: int32
          readOnly: true
          title: down
          type: integer
        running:
          description: Number of running apps/clusters in the deployment, value from owned GitRepo objects.
          format: int32
          readOnly: true
          title: running
          type: integer
        total:
          description: Total count of apps/clusters in the deployment, value from owned GitRepo objects.
          format: int32
          readOnly: true
          title: total
