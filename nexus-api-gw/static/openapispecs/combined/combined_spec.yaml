components:
  parameters:
    activeAlertsQueryFilter:
      description: Shows active alerts
      in: query
      name: active
      schema:
        default: true
        type: boolean
    alertDefinitionId:
      description: ID of an alert definition (UUID format)
      in: path
      name: alertDefinitionID
      required: true
      schema:
        format: uuid
        type: string
    alertsQueryFilter:
      description: Filters the alert definitions by name
      in: query
      name: alert
      schema:
        type: string
    appQueryFilter:
      description: Filters the alerts by application or deployment ID
      in: query
      name: app
      schema:
        type: string
    clusterQueryFilter:
      description: Filters the alerts by cluster ID
      in: query
      name: cluster
      schema:
        type: string
    hostQueryFilter:
      description: Filters the alerts by Host ID
      in: query
      name: host
      schema:
        type: string
    receiverId:
      description: ID of a receiver (UUID format)
      in: path
      name: receiverID
      required: true
      schema:
        format: uuid
        type: string
    renderedTemplateQueryParam:
      description: Specifies if template values will be rendered
      in: query
      name: rendered
      schema:
        default: false
        type: boolean
    suppressedAlertsQueryFilter:
      description: Shows suppressed alerts
      in: query
      name: suppressed
      schema:
        default: true
        type: boolean
  requestBodies:
