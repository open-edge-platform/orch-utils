  name: svc-observability-mimir-gateway-hostname
  namespace: orch-gateway
spec:
  headers:
    customRequestHeaders:
      Host: edgenode-observability-mimir-gateway.orch-infra.svc
---
apiVersion: {{ .Values.traefikApiGroup }}
kind: Middleware
