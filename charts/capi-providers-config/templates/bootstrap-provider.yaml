---
{{- range .Values.bootstrap.providers }}
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: BootstrapProvider
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  {{- toYaml .spec | nindent 2 }}
---
{{- if .additionalManifests }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .additionalManifests.name }}
  namespace: {{ .additionalManifests.namespace | default .namespace }}
data:
  manifests: |
    {{- if .additionalManifests.manifests }}
    {{- toYaml .additionalManifests.manifests | nindent 4 }}
    {{- end }}
    {{- if $.Values.metrics.enabled }}
    ---
    {{- include "metricsservicetemplate" (dict "name" (printf "%s-%s" "bootstrap" .name) "namespace" .namespace ) | nindent 4 }}
        selector:
          cluster.x-k8s.io/provider: bootstrap-{{ .name }}
    ---
    {{- include "metricsservicemonitortemplate" (dict "name" (printf "%s-%s" "bootstrap" .name) "namespace" .namespace) | nindent 4 }}
    {{- end }}
{{- end }}
---
{{- end }}
