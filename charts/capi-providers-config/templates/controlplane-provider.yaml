---
{{- range .Values.controlplane.providers }}
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: ControlPlaneProvider
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  {{- toYaml (omit .spec "manifestPatches") | nindent 2 }}
  {{- with .spec.manifestPatches }}
  manifestPatches:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- toYaml (omit .spec "additionalManifests") | nindent 2 }}
  {{- with .spec.additionalManifests }}
  additionalManifests:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- if .spec.additionalManifests }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .spec.additionalManifests.name }}
  namespace: {{ .spec.additionalManifests.namespace | default .namespace }}
data:
  manifests: |
    {{- if .spec.additionalManifests.manifests }}
    {{- toYaml .additionalManifests.manifests | nindent 4 }}
    {{- end }}
    {{- if $.Values.metrics.enabled }}
    ---
    {{- include "metricsservicetemplate" (dict "name" (printf "%s-%s" "controlplane" .spec.additionalManifests.name) "namespace" .spec.additionalManifests.namespace ) | nindent 4 }}
        selector:
          cluster.x-k8s.io/provider: control-plane-{{ .name }}
    ---
    {{- include "metricsservicemonitortemplate" (dict "name" (printf "%s-%s" "controlplane" .spec.additionalManifests.name) "namespace" .spec.additionalManifests.namespace) | nindent 4 }}
    {{- end }}
{{- end }}
---
{{- end }}
