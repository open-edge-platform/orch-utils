---

# CAPI providers are deployed via CAPI operator and configured via its CRds
# the helmchart .spec is passed unmodified to the CRD .spec

# https://doc.crds.dev/github.com/kubernetes-sigs/cluster-api-operator/operator.cluster.x-k8s.io/CoreProvider/v1alpha2@v0.23.0
core:
  name: cluster-api
  namespace: capi-system
  spec:
    version: "v1.10.7"
    configSecret:
      namespace: capi-variables
      name: capi-variables

# https://doc.crds.dev/github.com/kubernetes-sigs/cluster-api-operator/operator.cluster.x-k8s.io/BootstrapProvider/v1alpha2@v0.23.0
bootstrap:
  providers:
    - name: k3s
      namespace: capi-k3s-bootstrap-system
      spec:
        version: v0.3.0
        fetchConfig:
          url: "https://github.com/k3s-io/cluster-api-k3s/releases/v0.3.0/bootstrap-components.yaml"
        configSecret:
          namespace: capi-variables
          name: capi-variables

# https://doc.crds.dev/github.com/kubernetes-sigs/cluster-api-operator/operator.cluster.x-k8s.io/ControlPlaneProvider/v1alpha2@v0.23.0
controlplane:
  providers:
    - name: k3s
      namespace: capi-k3s-control-plane-system
      spec:
        version: v0.3.0
        fetchConfig:
          url: "https://github.com/k3s-io/cluster-api-k3s/releases/v0.3.0/control-plane-components.yaml"
        configSecret:
          namespace: capi-variables
          name: capi-variables

# Configuration for enabling or disabling metrics
# For all CAPI providers
metrics:
  enabled: true

# Labels to be applied to on namespaces created by this chart
namespaceLabels:
  istio-injection: enabled
