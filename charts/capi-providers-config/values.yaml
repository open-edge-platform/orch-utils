---

# CAPI providers are deployed via CAPI operator and configured via its CRds
# the helmchart .spec is passed unmodified to the CRD .spec

# https://doc.crds.dev/github.com/kubernetes-sigs/cluster-api-operator/operator.cluster.x-k8s.io/CoreProvider/v1alpha2@v0.15.1
core:
  name: cluster-api
  namespace: capi-system
  spec:
    version: "v1.9.7"
    configSecret:
      namespace: capi-variables
      name: capi-variables

# https://doc.crds.dev/github.com/kubernetes-sigs/cluster-api-operator/operator.cluster.x-k8s.io/BootstrapProvider/v1alpha2@v0.15.1
bootstrap:
  providers:
    - name: rke2
      namespace: capr-system
      spec:
        version: v0.14.0
        configSecret:
          namespace: capi-variables
          name: capi-variables
    - name: k3s
      namespace: capi-k3s-bootstrap-system
      spec:
        version: v0.2.1
        fetchConfig:
          url: "https://github.com/k3s-io/cluster-api-k3s/releases/v0.2.1/bootstrap-components.yaml"
        configSecret:
          namespace: capi-variables
          name: capi-variables
# https://doc.crds.dev/github.com/kubernetes-sigs/cluster-api-operator/operator.cluster.x-k8s.io/ControlPlaneProvider/v1alpha2@v0.15.1
controlplane:
  providers:
    - name: rke2
      namespace: capr-system
      spec:
        version: v0.14.0
        configSecret:
          namespace: capi-variables
          name: capi-variables
    - name: k3s
      namespace: capi-k3s-control-plane-system
      spec:
        version: v0.2.1
        fetchConfig:
          url: "https://github.com/k3s-io/cluster-api-k3s/releases/v0.2.1/control-plane-components.yaml"
        configSecret:
          namespace: capi-variables
          name: capi-variables
# Configuration for enabling or disabling metrics
# For all CAPI providers
metrics:
  enabled: true
