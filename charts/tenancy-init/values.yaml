---

global:
  name: tenancy-init

imagePullSecrets: ""
image:
  registry: registry-rs.edgeorchestration.intel.com/edge-orch
  repository: common/tenancy-init
  pullPolicy: IfNotPresent

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: tenant-init-k8s-api-service-account

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000

tolerations: []

affinity: {}

nodeSelector: {}

podAnnotations: {}

logLevel: info

tenant:
  orgName: "default"
  projectName: "default"
keycloak:
  service:
    name: "platform-keycloak"
    port: "8080"
    namespace: "orch-platform"
  roles:
    admin:
      groups: "Project-Manager-Group"
    edge:
      groups: "Edge-Manager-Group,Edge-Onboarding-Group,Edge-Operator-Group,Host-Manager-Group"
