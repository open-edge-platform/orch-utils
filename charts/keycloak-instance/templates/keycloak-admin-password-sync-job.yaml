# Keycloak Admin Password Sync CronJob
# Continuously ensures the bootstrap admin password in PostgreSQL matches the secret.
# Runs every 5 minutes as a best-effort background task that gracefully handles
# transient failures (e.g., Keycloak not yet ready, database temporarily unavailable).
# This is integrated as part of keycloak-instance chart deployment, not a standalone job.

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.keycloakAdminPasswordSync.job.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.keycloakAdminPasswordSync.job.labels | nindent 4 }}
spec:
  # Run every 5 minutes to ensure continuous password synchronization
  schedule: {{ .Values.keycloakAdminPasswordSync.job.schedule | quote }}
  # Keep the last 3 successful and failed job runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Don't create concurrent jobs if a previous one hasn't finished
  concurrencyPolicy: Forbid
  # Start deadline in seconds (if a scheduled job misses its run window, don't start it)
  startingDeadlineSeconds: 300
  jobTemplate:
    metadata:
      labels:
        {{- toYaml .Values.keycloakAdminPasswordSync.job.labels | nindent 8 }}
    spec:
      ttlSecondsAfterFinished: {{ .Values.keycloakAdminPasswordSync.job.ttlSecondsAfterFinished }}
      backoffLimit: {{ .Values.keycloakAdminPasswordSync.job.backoffLimit }}
      template:
        metadata:
          labels:
            {{- toYaml .Values.keycloakAdminPasswordSync.job.labels | nindent 12 }}
        spec:
          serviceAccountName: {{ .Values.keycloakAdminPasswordSync.serviceAccount.name }}
          restartPolicy: {{ .Values.keycloakAdminPasswordSync.job.restartPolicy }}
          securityContext:
            {{- toYaml .Values.keycloakAdminPasswordSync.job.securityContext | nindent 12 }}
          containers:
            - name: {{ .Values.keycloakAdminPasswordSync.job.container.name }}
              image: {{ .Values.keycloakAdminPasswordSync.job.container.image }}
              imagePullPolicy: {{ .Values.keycloakAdminPasswordSync.job.container.imagePullPolicy }}
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGHOST
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGPORT
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGUSER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGPASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGDATABASE
                - name: ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.bootstrapAdmin.secret }}
                      key: password
              command:
                - /bin/sh
                - -c
                - |
                  set +e
                  echo "=== Keycloak Admin Password Sync ==="
                  echo "Time: $(date -u)"
                  echo ""
                  
                  # Install required packages
                  echo "Installing required packages..."
                  apk add --no-cache postgresql-client curl jq 2>/dev/null || true
                  pip install psycopg2-binary requests -q 2>/dev/null || true
                  
                  echo "Checking Keycloak availability..."
                  max_attempts=10
                  attempt=0
                  KC_READY=0
                  while [ $attempt -lt $max_attempts ]; do
                    if kubectl get pod -n {{ .Values.namespace }} -l app=keycloak -o jsonpath='{.items[0].status.containerStatuses[?(@.name=="keycloak")].ready}' 2>/dev/null | grep -q "true"; then
                      echo "✓ Keycloak is ready"
                      KC_READY=1
                      break
                    fi
                    attempt=$((attempt + 1))
                    echo "  Check... ($attempt/$max_attempts)"
                    sleep 3
                  done
                  if [ $KC_READY -eq 0 ]; then
                    echo "⚠ Keycloak not ready, skipping sync (will retry in 5 minutes)"
                    exit 0
                  fi
                  
                  echo ""
                  echo "Checking PostgreSQL availability..."
                  max_attempts=10
                  attempt=0
                  DB_READY=0
                  while [ $attempt -lt $max_attempts ]; do
                    if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" 2>/dev/null; then
                      echo "✓ PostgreSQL is ready"
                      DB_READY=1
                      break
                    fi
                    attempt=$((attempt + 1))
                    echo "  Check... ($attempt/$max_attempts)"
                    sleep 3
                  done
                  if [ $DB_READY -eq 0 ]; then
                    echo "⚠ PostgreSQL not ready, skipping sync (will retry in 5 minutes)"
                    exit 0
                  fi
                  
                  echo ""
                  echo "Checking admin password synchronization..."
                  
                  python3 << 'PYEND'
import psycopg2
import os
import hashlib
import base64
import requests
import sys

# Get environment variables
PGHOST = os.environ.get('PGHOST')
PGPORT = os.environ.get('PGPORT', '5432')
PGUSER = os.environ.get('PGUSER')
PGPASSWORD = os.environ.get('PGPASSWORD')
PGDATABASE = os.environ.get('PGDATABASE')
ADMIN_PASSWORD = os.environ.get('ADMIN_PASSWORD')

# Connect to database
try:
    conn = psycopg2.connect(
        host=PGHOST,
        port=PGPORT,
        user=PGUSER,
        password=PGPASSWORD,
        database=PGDATABASE
    )
    cursor = conn.cursor()
except Exception as e:
    print(f"⚠ Could not connect to database: {e}")
    sys.exit(0)

# Find admin user ID
try:
    cursor.execute("""
        SELECT id FROM user_entity
        WHERE username = 'admin'
        AND realm_id = (SELECT id FROM realm WHERE name = 'master')
        LIMIT 1
    """)
    result = cursor.fetchone()
    if not result:
        print("⚠ Admin user not found, skipping sync (initialization in progress)")
        conn.close()
        sys.exit(0)
    ADMIN_ID = result[0]
    print(f"Admin user ID: {ADMIN_ID}")
except Exception as e:
    print(f"⚠ Could not query admin user: {e}")
    conn.close()
    sys.exit(0)

# Try to authenticate with current password
KEYCLOAK_URL = "http://platform-keycloak.{{ .Values.namespace }}.svc:8080"
try:
    response = requests.post(
        f"{KEYCLOAK_URL}/realms/master/protocol/openid-connect/token",
        data={
            'client_id': 'admin-cli',
            'username': 'admin',
            'password': ADMIN_PASSWORD,
            'grant_type': 'password'
        },
        timeout=5
    )
    if response.status_code == 200:
        data = response.json()
        if 'access_token' in data:
            print("✓ Admin authentication successful")
            print("✓ No action needed - passwords are synchronized")
            conn.close()
            sys.exit(0)
except Exception as e:
    pass

print("⚠ Admin authentication failed")
print("Attempting to sync password...")

# Generate new password hash
try:
    salt = os.urandom(16)
    h = hashlib.pbkdf2_hmac('sha256', ADMIN_PASSWORD.encode(), salt, 27500)
    password_hash = f"pbkdf2-sha256\$27500\${base64.b64encode(salt).decode()}\${base64.b64encode(h).decode()}"
except Exception as e:
    print(f"⚠ Could not generate password hash: {e}")
    conn.close()
    sys.exit(0)

# Update database with new password hash
try:
    print("Updating database with new password hash...")
    cursor.execute(
        "UPDATE credential SET value = %s WHERE user_id = %s AND type = 'password'",
        (password_hash, ADMIN_ID)
    )
    conn.commit()
    print("✓ Database updated successfully")
    
    # Verify the hash was updated
    cursor.execute(
        "SELECT value FROM credential WHERE user_id = %s AND type = 'password' LIMIT 1",
        (ADMIN_ID,)
    )
    verify_result = cursor.fetchone()
    if verify_result and verify_result[0] == password_hash:
        print("✓ Password hash verified in database")
    else:
        print("⚠ Warning: password hash verification failed")
except Exception as e:
    print(f"⚠ Database update failed: {e}")
finally:
    conn.close()

print("✓ Sync completed successfully")
PYEND
                  
                  PYTHON_EXIT=$?
                  if [ $PYTHON_EXIT -ne 0 ]; then
                    echo "⚠ Sync script failed, will retry in 5 minutes"
                    exit 0
                  fi
                  
                  echo "Done!"
                  exit 0
              resources:
                {{- toYaml .Values.keycloakAdminPasswordSync.job.container.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.keycloakAdminPasswordSync.job.container.securityContext | nindent 16 }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.keycloakAdminPasswordSync.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.keycloakAdminPasswordSync.serviceAccount.labels | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-pod-reader
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-pod-reader-binding
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.keycloakAdminPasswordSync.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
