# Keycloak Admin Password Sync CronJob
# Continuously ensures the bootstrap admin password in PostgreSQL matches the secret.
# Runs every 5 minutes as a best-effort background task that gracefully handles
# transient failures (e.g., Keycloak not yet ready, database temporarily unavailable).
# This is integrated as part of keycloak-instance chart deployment, not a standalone job.

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.keycloakAdminPasswordSync.job.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.keycloakAdminPasswordSync.job.labels | nindent 4 }}
spec:
  # Run every 5 minutes to ensure continuous password synchronization
  schedule: {{ .Values.keycloakAdminPasswordSync.job.schedule | quote }}
  # Keep the last 3 successful and failed job runs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Don't create concurrent jobs if a previous one hasn't finished
  concurrencyPolicy: Forbid
  # Start deadline in seconds (if a scheduled job misses its run window, don't start it)
  startingDeadlineSeconds: 300
  jobTemplate:
    metadata:
      labels:
        {{- toYaml .Values.keycloakAdminPasswordSync.job.labels | nindent 8 }}
    spec:
      ttlSecondsAfterFinished: {{ .Values.keycloakAdminPasswordSync.job.ttlSecondsAfterFinished }}
      backoffLimit: {{ .Values.keycloakAdminPasswordSync.job.backoffLimit }}
      template:
        metadata:
          labels:
            {{- toYaml .Values.keycloakAdminPasswordSync.job.labels | nindent 12 }}
        spec:
          serviceAccountName: {{ .Values.keycloakAdminPasswordSync.serviceAccount.name }}
          restartPolicy: {{ .Values.keycloakAdminPasswordSync.job.restartPolicy }}
          securityContext:
            {{- toYaml .Values.keycloakAdminPasswordSync.job.securityContext | nindent 12 }}
          containers:
            - name: {{ .Values.keycloakAdminPasswordSync.job.container.name }}
              image: {{ .Values.keycloakAdminPasswordSync.job.container.image }}
              imagePullPolicy: {{ .Values.keycloakAdminPasswordSync.job.container.imagePullPolicy }}
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGHOST
                - name: PGPORT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGPORT
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGUSER
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGPASSWORD
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.database.passwordSecret.name }}
                      key: PGDATABASE
                - name: ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.keycloak.bootstrapAdmin.secret }}
                      key: password
              command:
                - /bin/sh
                - -c
                - >-
                  echo "=== Keycloak Admin Password Sync ===";
                  echo "Time: $(date -u)";
                  echo "";
                  echo "Checking Keycloak availability...";
                  max_attempts=10;
                  attempt=0;
                  KC_READY=0;
                  while [ $attempt -lt $max_attempts ]; do
                    if kubectl get pod -n {{ .Values.namespace }} -l app=keycloak -o jsonpath='{.items[0].status.containerStatuses[?(@.name=="keycloak")].ready}' 2>/dev/null | grep -q "true"; then
                      echo "✓ Keycloak is ready";
                      KC_READY=1;
                      break;
                    fi;
                    attempt=$((attempt + 1));
                    echo "  Check... ($attempt/$max_attempts)";
                    sleep 3;
                  done;
                  if [ $KC_READY -eq 0 ]; then
                    echo "⚠ Keycloak not ready, skipping sync (will retry in 5 minutes)";
                    exit 0;
                  fi;
                  echo "";
                  echo "Checking PostgreSQL availability...";
                  max_attempts=10;
                  attempt=0;
                  DB_READY=0;
                  while [ $attempt -lt $max_attempts ]; do
                    if pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" 2>/dev/null; then
                      echo "✓ PostgreSQL is ready";
                      DB_READY=1;
                      break;
                    fi;
                    attempt=$((attempt + 1));
                    echo "  Check... ($attempt/$max_attempts)";
                    sleep 3;
                  done;
                  if [ $DB_READY -eq 0 ]; then
                    echo "⚠ PostgreSQL not ready, skipping sync (will retry in 5 minutes)";
                    exit 0;
                  fi;
                  echo "";
                  echo "Checking admin password synchronization...";
                  PSQL="psql -h $PGHOST -p $PGPORT -U $PGUSER -d $PGDATABASE";
                  ADMIN_ID=$($PSQL -tAc "SELECT id FROM user_entity WHERE username = 'admin' AND realm_id = (SELECT id FROM realm WHERE name = 'master') LIMIT 1;" 2>&1);
                  if [ -z "$ADMIN_ID" ]; then
                    echo "⚠ Admin user not found, skipping sync (initialization in progress)";
                    exit 0;
                  fi;
                  echo "Admin user ID: $ADMIN_ID";
                  KEYCLOAK_URL="http://platform-keycloak.{{ .Values.namespace }}.svc:8080";
                  AUTH_RESPONSE=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" --header "Content-Type: application/x-www-form-urlencoded" --data-urlencode "client_id=admin-cli" --data-urlencode "username=admin" --data-urlencode "password=${ADMIN_PASSWORD}" --data-urlencode "grant_type=password" 2>&1);
                  TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.access_token // empty' 2>/dev/null);
                  if [[ -n "$TOKEN" && "$TOKEN" != "null" && "$TOKEN" != "" ]]; then
                    echo "✓ Admin authentication successful";
                    echo "✓ No action needed - passwords are synchronized";
                    exit 0;
                  fi;
                  echo "⚠ Admin authentication failed";
                  echo "Attempting to sync password...";
                  NEW_PASSWORD_HASH=$(python3 -c "import os, hashlib, base64;salt=os.urandom(16);h=hashlib.pbkdf2_hmac('sha256',os.environ.get('ADMIN_PASSWORD').encode(),salt,27500);print(f'pbkdf2-sha256\$27500\${base64.b64encode(salt).decode()}\${base64.b64encode(h).decode()}')");
                  if [ -z "$NEW_PASSWORD_HASH" ]; then
                    echo "⚠ Could not generate password hash, will retry";
                    exit 0;
                  fi;
                  echo "Updating database with new password hash...";
                  UPDATE_RESULT=$($PSQL -c "UPDATE credential SET value = '$NEW_PASSWORD_HASH' WHERE user_id = '$ADMIN_ID' AND type = 'password';" 2>&1);
                  VERIFY_HASH=$($PSQL -tAc "SELECT value FROM credential WHERE user_id = '$ADMIN_ID' AND type = 'password' LIMIT 1;" 2>&1);
                  if [[ "$VERIFY_HASH" == "$NEW_PASSWORD_HASH" ]]; then
                    echo "✓ Password updated in database";
                    echo "Testing authentication with updated password...";
                    sleep 2;
                    AUTH_RESPONSE=$(curl -s -X POST "${KEYCLOAK_URL}/realms/master/protocol/openid-connect/token" --header "Content-Type: application/x-www-form-urlencoded" --data-urlencode "client_id=admin-cli" --data-urlencode "username=admin" --data-urlencode "password=${ADMIN_PASSWORD}" --data-urlencode "grant_type=password" 2>&1);
                    TOKEN=$(echo "$AUTH_RESPONSE" | jq -r '.access_token // empty' 2>/dev/null);
                    if [[ -n "$TOKEN" && "$TOKEN" != "null" && "$TOKEN" != "" ]]; then
                      echo "✓ SUCCESS: Password synchronization complete";
                      exit 0;
                    else
                      echo "⚠ Database updated but auth test still failing";
                      echo "Will retry on next schedule";
                      exit 0;
                    fi;
                  else
                    echo "⚠ Database update could not be verified";
                    echo "Will retry on next schedule";
                    exit 0;
                  fi;
              resources:
                {{- toYaml .Values.keycloakAdminPasswordSync.job.container.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.keycloakAdminPasswordSync.job.container.securityContext | nindent 16 }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.keycloakAdminPasswordSync.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.keycloakAdminPasswordSync.serviceAccount.labels | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-pod-reader
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-pod-reader-binding
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Values.keycloakAdminPasswordSync.serviceAccount.name }}
    namespace: {{ .Values.namespace }}
