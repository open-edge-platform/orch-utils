# Keycloak Config CLI Job - Applies realm configuration
# This job runs after Keycloak is ready to ensure clients, roles, groups, and users are created
# Configuration is externalized to values.yaml for easy customization

{{- if .Values.keycloakConfigCli.enabled }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.keycloakConfigCli.job.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.keycloakConfigCli.job.labels | nindent 4 }}
spec:
  ttlSecondsAfterFinished: {{ .Values.keycloakConfigCli.job.ttlSecondsAfterFinished }}
  backoffLimit: {{ .Values.keycloakConfigCli.job.backoffLimit }}
  template:
    metadata:
      labels:
        {{- toYaml .Values.keycloakConfigCli.job.podLabels | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.keycloakConfigCli.serviceAccount.name }}
      restartPolicy: {{ .Values.keycloakConfigCli.job.restartPolicy }}
      securityContext:
        {{- toYaml .Values.keycloakConfigCli.job.securityContext | nindent 8 }}
      {{- if .Values.keycloakConfigCli.job.initContainers }}
      initContainers:
        {{- range .Values.keycloakConfigCli.job.initContainers }}
        - name: {{ .name }}
          image: {{ .image }}
          imagePullPolicy: {{ .imagePullPolicy }}
          command:
            {{- toYaml .command | nindent 12 }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            {{- toYaml .securityContext | nindent 12 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Values.keycloakConfigCli.job.container.name }}
          image: {{ tpl .Values.keycloakConfigCli.job.container.image . }}
          imagePullPolicy: {{ .Values.keycloakConfigCli.job.container.imagePullPolicy }}
          env:
            {{- toYaml .Values.keycloakConfigCli.job.container.env | nindent 12 }}
          volumeMounts:
            {{- toYaml .Values.keycloakConfigCli.job.container.volumeMounts | nindent 12 }}
          resources:
            {{- toYaml .Values.keycloakConfigCli.job.container.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.keycloakConfigCli.job.container.securityContext | nindent 12 }}
      volumes:
        {{- toYaml .Values.keycloakConfigCli.job.volumes | nindent 8 }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.keycloakConfigCli.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.keycloakConfigCli.serviceAccount.labels | nindent 4 }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.keycloakConfigCli.configMap.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.keycloakConfigCli.configMap.labels | nindent 4 }}
data:
  realm-master.json: |
{{ .Values.realmMaster | indent 4 }}

{{- end }}

