{{- if .Values.m2mSecretsExtractor.enabled }}
---
# Job to extract M2M client secrets from Keycloak and create Kubernetes secrets
# This ensures that services can retrieve their client credentials for M2M authentication
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-m2m-secret-creator
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "175"
  labels:
    app.kubernetes.io/name: keycloak-m2m-secret-creator
    app.kubernetes.io/part-of: keycloak-instance
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-m2m-secret-creator
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "175"
  labels:
    app.kubernetes.io/name: keycloak-m2m-secret-creator
    app.kubernetes.io/part-of: keycloak-instance
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-m2m-secret-creator
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "175"
  labels:
    app.kubernetes.io/name: keycloak-m2m-secret-creator
    app.kubernetes.io/part-of: keycloak-instance
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-m2m-secret-creator
subjects:
- kind: ServiceAccount
  name: keycloak-m2m-secret-creator
  namespace: {{ .Release.Namespace }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-m2m-secrets-extractor
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "180"
  labels:
    app.kubernetes.io/name: keycloak-m2m-secrets-extractor
    app.kubernetes.io/part-of: keycloak-instance
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: keycloak-m2m-secrets-extractor
        app.kubernetes.io/part-of: keycloak-instance
    spec:
      serviceAccountName: keycloak-m2m-secret-creator
      restartPolicy: Never
      containers:
      - name: m2m-secret-extractor
        image: curlimages/curl:8.5.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
          - -c
          - |
            set -e
            
            log() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1"
            }
            
            KEYCLOAK_URL="http://platform-keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080"
            KEYCLOAK_USER="admin"
            KEYCLOAK_PASSWORD="$(cat /run/secrets/keycloak/password)"
            REALM="master"
            M2M_CLIENTS="{{ .Values.m2mSecretsExtractor.clients | join " " }}"
            
            log "Starting M2M client secrets extraction job..."
            log "Keycloak URL: $KEYCLOAK_URL"
            
            # Wait for Keycloak
            log "Waiting for Keycloak to be available..."
            for i in $(seq 1 30); do
              if curl -f -s -m 5 "$KEYCLOAK_URL/realms/master" > /dev/null 2>&1; then
                log "Keycloak is available!"
                break
              fi
              if [ $i -eq 30 ]; then
                log "ERROR: Keycloak not available after 5 minutes"
                exit 1
              fi
              log "Attempt $i/30: Waiting for Keycloak..."
              sleep 10
            done
            
            # Get admin token
            log "Getting admin token..."
            TOKEN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$KEYCLOAK_URL/realms/$REALM/protocol/openid-connect/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              --data-urlencode "username=$KEYCLOAK_USER" \
              --data-urlencode "password=$KEYCLOAK_PASSWORD" \
              --data-urlencode "grant_type=password" \
              --data-urlencode "client_id=admin-cli")
            
            TOKEN_HTTP=$(echo "$TOKEN_RESPONSE" | tail -n1)
            TOKEN_BODY=$(echo "$TOKEN_RESPONSE" | head -n-1)
            
            if [ "$TOKEN_HTTP" != "200" ]; then
              log "ERROR: Failed to get admin token (HTTP $TOKEN_HTTP)"
              log "Response: $TOKEN_BODY"
              exit 1
            fi
            
            TOKEN=$(echo "$TOKEN_BODY" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
            
            if [ -z "$TOKEN" ]; then
              log "ERROR: Could not extract token from response"
              exit 1
            fi
            
            log "Admin token obtained successfully"
            
            # Extract secrets for each M2M client
            for CLIENT_ID in $M2M_CLIENTS; do
              log "Processing client: $CLIENT_ID"
              
              # Get client UUID
              CLIENT_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
                "$KEYCLOAK_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" \
                -H "Authorization: Bearer $TOKEN")
              
              CLIENT_HTTP=$(echo "$CLIENT_RESPONSE" | tail -n1)
              CLIENT_BODY=$(echo "$CLIENT_RESPONSE" | head -n-1)
              
              if [ "$CLIENT_HTTP" != "200" ]; then
                log "WARNING: Failed to lookup client $CLIENT_ID (HTTP $CLIENT_HTTP), skipping"
                continue
              fi
              
              CLIENT_UUID=$(echo "$CLIENT_BODY" | grep -o '"id":"[^"]*' | head -1 | cut -d'"' -f4)
              
              if [ -z "$CLIENT_UUID" ]; then
                log "WARNING: Could not find UUID for $CLIENT_ID, skipping"
                continue
              fi
              
              log "Found client UUID: $CLIENT_UUID"
              
              # Get client secret
              SECRET_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
                "$KEYCLOAK_URL/admin/realms/$REALM/clients/$CLIENT_UUID/client-secret" \
                -H "Authorization: Bearer $TOKEN")
              
              SECRET_HTTP=$(echo "$SECRET_RESPONSE" | tail -n1)
              SECRET_BODY=$(echo "$SECRET_RESPONSE" | head -n-1)
              
              if [ "$SECRET_HTTP" != "200" ]; then
                log "WARNING: Failed to get secret for $CLIENT_ID (HTTP $SECRET_HTTP), skipping"
                continue
              fi
              
              CLIENT_SECRET=$(echo "$SECRET_BODY" | grep -o '"value":"[^"]*' | cut -d'"' -f4)
              
              if [ -z "$CLIENT_SECRET" ]; then
                log "WARNING: Could not extract secret value for $CLIENT_ID, skipping"
                continue
              fi
              
              log "Successfully extracted secret for $CLIENT_ID"
              
              # Create the secret - kubectl will be injected via container image
              # We'll create a secret in the format: clientid-secret
              SECRET_NAME="${CLIENT_ID}-secret"
              
              # Create or update the secret using kubectl
              kubectl create secret generic "$SECRET_NAME" \
                --from-literal=clientId="$CLIENT_ID" \
                --from-literal=clientSecret="$CLIENT_SECRET" \
                -n {{ .Release.Namespace }} \
                --dry-run=client -o yaml | kubectl apply -f -
              
              log "Created/updated Kubernetes secret: $SECRET_NAME"
            done
            
            log "M2M client secrets extraction completed successfully"
        env:
        - name: KEYCLOAK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-keycloak
              key: password
        volumeMounts:
        - name: keycloak-secret
          mountPath: /run/secrets/keycloak
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: keycloak-secret
        secret:
          secretName: platform-keycloak
          defaultMode: 0400
{{- end }}
