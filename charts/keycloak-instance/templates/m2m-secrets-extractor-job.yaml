{{- if .Values.m2mSecretsExtractor.enabled }}
---
# ConfigMap with the extraction script
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-m2m-extractor-script
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: keycloak-m2m-extractor-script
    app.kubernetes.io/part-of: keycloak-instance
data:
  extract-secrets.sh: |
    #!/bin/sh
    set -e

    KEYCLOAK_URL="http://platform-keycloak.{{ .Release.Namespace }}.svc.cluster.local:8080"
    KEYCLOAK_USER="admin"
    KEYCLOAK_PASSWORD="$(cat /run/secrets/keycloak/password)"
    REALM="master"
    NAMESPACE="{{ .Release.Namespace }}"
    M2M_CLIENTS='{{ .Values.m2mSecretsExtractor.clients | join " " }}'

    log() {
      echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1"
    }

    log "Starting M2M client secrets extraction..."

    # Wait for Keycloak
    log "Waiting for Keycloak..."
    for i in $(seq 1 30); do
      if curl -f -s -m 5 "$KEYCLOAK_URL/realms/master" >/dev/null 2>&1; then
        log "Keycloak is available"
        break
      fi
      if [ "$i" -eq 30 ]; then
        log "ERROR: Keycloak not available"
        exit 1
      fi
      log "Attempt $i/30..."
      sleep 10
    done

    # Get admin token
    log "Getting admin token..."
    TOKEN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$KEYCLOAK_URL/realms/$REALM/protocol/openid-connect/token" \
      -H "Content-Type: application/x-www-form-urlencoded" \
      --data-urlencode "username=$KEYCLOAK_USER" \
      --data-urlencode "password=$KEYCLOAK_PASSWORD" \
      --data-urlencode "grant_type=password" \
      --data-urlencode "client_id=admin-cli")

    TOKEN_HTTP=$(echo "$TOKEN_RESPONSE" | tail -n1)
    TOKEN_BODY=$(echo "$TOKEN_RESPONSE" | head -n-1)

    if [ "$TOKEN_HTTP" != "200" ]; then
      log "ERROR: Failed to get token (HTTP $TOKEN_HTTP)"
      exit 1
    fi

    TOKEN=$(echo "$TOKEN_BODY" | grep -o '"access_token":"[^"]*' | cut -d'"' -f4)
    if [ -z "$TOKEN" ]; then
      log "ERROR: Could not extract token"
      exit 1
    fi
    log "Token obtained"

    # Process each client
    for CLIENT_ID in $M2M_CLIENTS; do
      log "Processing: $CLIENT_ID"

      # Get client UUID
      CLIENT_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
        "$KEYCLOAK_URL/admin/realms/$REALM/clients?clientId=$CLIENT_ID" \
        -H "Authorization: Bearer $TOKEN")

      CLIENT_HTTP=$(echo "$CLIENT_RESPONSE" | tail -n1)
      CLIENT_BODY=$(echo "$CLIENT_RESPONSE" | head -n-1)

      if [ "$CLIENT_HTTP" != "200" ]; then
        log "WARNING: Failed to lookup $CLIENT_ID"
        continue
      fi

      CLIENT_UUID=$(echo "$CLIENT_BODY" | grep -o '"id":"[^"]*' | head -1 | cut -d'"' -f4)
      if [ -z "$CLIENT_UUID" ]; then
        log "WARNING: No UUID for $CLIENT_ID"
        continue
      fi

      log "UUID: $CLIENT_UUID"

      # Get client secret
      SECRET_RESPONSE=$(curl -s -w "\n%{http_code}" -X GET \
        "$KEYCLOAK_URL/admin/realms/$REALM/clients/$CLIENT_UUID/client-secret" \
        -H "Authorization: Bearer $TOKEN")

      SECRET_HTTP=$(echo "$SECRET_RESPONSE" | tail -n1)
      SECRET_BODY=$(echo "$SECRET_RESPONSE" | head -n-1)

      if [ "$SECRET_HTTP" != "200" ]; then
        log "WARNING: Failed to get secret"
        continue
      fi

      CLIENT_SECRET=$(echo "$SECRET_BODY" | grep -o '"value":"[^"]*' | cut -d'"' -f4)
      if [ -z "$CLIENT_SECRET" ]; then
        log "WARNING: No secret value"
        continue
      fi

      log "Creating Kubernetes Secret..."

      SECRET_NAME="${CLIENT_ID}-secret"
      CLIENT_ID_B64=$(echo -n "$CLIENT_ID" | base64 -w 0)
      CLIENT_SECRET_B64=$(echo -n "$CLIENT_SECRET" | base64 -w 0)

      KAPI="https://kubernetes.default.svc.cluster.local"
      TOKEN_FILE="/var/run/secrets/kubernetes.io/serviceaccount/token"
      CA_FILE="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      SA_TOKEN=$(cat "$TOKEN_FILE")

      PAYLOAD="{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$SECRET_NAME\"},\"type\":\"Opaque\",\"data\":{\"clientId\":\"$CLIENT_ID_B64\",\"clientSecret\":\"$CLIENT_SECRET_B64\"}}"

      curl -s -X POST "$KAPI/api/v1/namespaces/$NAMESPACE/secrets" \
        -H "Authorization: Bearer $SA_TOKEN" \
        -H "Content-Type: application/json" \
        --cacert "$CA_FILE" \
        -d "$PAYLOAD" > /dev/null 2>&1 || \
      curl -s -X PATCH "$KAPI/api/v1/namespaces/$NAMESPACE/secrets/$SECRET_NAME" \
        -H "Authorization: Bearer $SA_TOKEN" \
        -H "Content-Type: application/json-patch+json" \
        --cacert "$CA_FILE" \
        -d "[{\"op\":\"replace\",\"path\":\"/data/clientSecret\",\"value\":\"$CLIENT_SECRET_B64\"}]" > /dev/null 2>&1

      log "Secret: $SECRET_NAME done"
    done

    log "All done"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-m2m-secret-creator
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "175"
  labels:
    app.kubernetes.io/name: keycloak-m2m-secret-creator
    app.kubernetes.io/part-of: keycloak-instance
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-m2m-secret-creator
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "175"
  labels:
    app.kubernetes.io/name: keycloak-m2m-secret-creator
    app.kubernetes.io/part-of: keycloak-instance
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-m2m-secret-creator
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "175"
  labels:
    app.kubernetes.io/name: keycloak-m2m-secret-creator
    app.kubernetes.io/part-of: keycloak-instance
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-m2m-secret-creator
subjects:
- kind: ServiceAccount
  name: keycloak-m2m-secret-creator
  namespace: {{ .Release.Namespace }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-m2m-secrets-extractor
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "180"
  labels:
    app.kubernetes.io/name: keycloak-m2m-secrets-extractor
    app.kubernetes.io/part-of: keycloak-instance
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app.kubernetes.io/name: keycloak-m2m-secrets-extractor
        app.kubernetes.io/part-of: keycloak-instance
    spec:
      serviceAccountName: keycloak-m2m-secret-creator
      restartPolicy: Never
      containers:
      - name: m2m-secret-extractor
        image: curlimages/curl:8.5.0
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh"]
        args:
          - /scripts/extract-secrets.sh
        volumeMounts:
        - name: script
          mountPath: /scripts
          readOnly: true
        - name: keycloak-secret
          mountPath: /run/secrets/keycloak
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          seccompProfile:
            type: RuntimeDefault










      - name: script
        configMap:
          name: keycloak-m2m-extractor-script
          defaultMode: 0555
      - name: keycloak-secret
        secret:
          secretName: platform-keycloak
          defaultMode: 292
{{- end }}
