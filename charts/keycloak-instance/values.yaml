# This file defines the schema and default values for the keycloak-instance Helm chart
# Values are provided directly by the platform-keycloak Application's valuesObject
# section in the ArgoCD Application manifest
# The values.yaml here serves as documentation and defaults if no valuesObject is provided

# Namespace configuration
# This namespace is where the Keycloak instance resources are deployed
namespace: orch-platform

# Keycloak instance configuration (Keycloak CRD)
keycloak:
  # Version information (sourced from Chart.yaml annotations)
  # version: 26.0.0 (from Chart.yaml)
  # upstreamVersion: 26.4.7 (from Chart.yaml annotation keycloak-upstream-version)
  # image: quay.io/keycloak/keycloak:26.4.7 (from Chart.yaml annotation keycloak-upstream-image)

  # Container image (uses upstream version from Chart.yaml)
  image: "quay.io/keycloak/keycloak:26.4.7"
  imagePullPolicy: IfNotPresent

  # Bootstrap admin credentials
  bootstrapAdmin:
    secret: platform-keycloak

  # Database configuration
  database:
    vendor: postgres
    host: postgresql-cluster-rw.orch-database.svc.cluster.local
    port: 5432
    database: orch-platform-platform-keycloak
    usernameSecret:
      name: platform-keycloak-local-postgresql
      key: PGUSER
    passwordSecret:
      name: platform-keycloak-local-postgresql
      key: PGPASSWORD
    # Connection pool settings
    poolInitialSize: 5
    poolMinSize: 5
    poolMaxSize: 50

  # HTTP configuration
  http:
    httpEnabled: true
    httpPort: 8080
    relativeUrl: "/"

  # Proxy headers for reverse proxy
  proxy:
    headers: xforwarded

  # Ingress configuration
  ingress:
    enabled: false

  # Pod resource allocation
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  # Runtime configuration options
  additionalOptions:
    - name: hostname-strict
      value: "false"
    - name: http-relative-path
      value: "/"
    - name: http-enabled
      value: "true"
    - name: db-url-properties
      value: "?tcpKeepAlives=true&socketTimeout=120&connectTimeout=120"
    - name: http-management-port
      value: "9000"
    - name: spi-login-protocol-openid-connect-legacy-logout-redirect-uri
      value: "true"
    - name: spi-brute-force-protector-default-brute-force-detector-allow-concurrent-requests
      value: "true"
    - name: log-level
      value: "INFO"
    - name: log-console-output
      value: "json"

  # Pod optimization
  startOptimized: true
  instances: 1

  # Pod template security and initialization
  podTemplate:
    # Pod security context
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault

    # Init container for building optimized Keycloak image
    initContainers:
      - name: keycloak-builder
        image: "quay.io/keycloak/keycloak:26.4.7"
        imagePullPolicy: IfNotPresent
        command:
          - /bin/bash
        args:
          - -c
          - |
            set -e
            /opt/keycloak/bin/kc.sh build \
              --db=postgres \
              --health-enabled=true \
              --metrics-enabled=true \
              --http-relative-path=/

            mkdir -p /shared/keycloak
            cp -r /opt/keycloak/* /shared/keycloak/
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault

        volumeMounts:
          - name: shared-keycloak
            mountPath: /shared/keycloak
          - name: tmp
            mountPath: /tmp

    # Main container security context
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

    # Container volume mounts
    containerVolumeMounts:
      - name: shared-keycloak
        mountPath: /opt/keycloak
        readOnly: true
      - name: tmp
        mountPath: /tmp
      - name: keycloak-data
        mountPath: /opt/keycloak/data

    # Pod volumes
    volumes:
      - name: shared-keycloak
        emptyDir:
          sizeLimit: 1Gi
      - name: tmp
        emptyDir:
          sizeLimit: 100Mi
      - name: keycloak-data
        emptyDir:
          sizeLimit: 500Mi

