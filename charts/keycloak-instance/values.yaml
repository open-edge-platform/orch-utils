# Keycloak Config CLI Job configuration
# This section defines the entire keycloak-config-cli Job including ServiceAccount, ConfigMap, and Job spec
keycloakConfigCli:
  # Enabled by default to apply realm configuration
  enabled: true

  # ServiceAccount configuration
  serviceAccount:
    name: keycloak-config-cli
    namespace: orch-platform
    labels:
      app.kubernetes.io/name: keycloak-config-cli
      app.kubernetes.io/instance: keycloak-config-cli
      app.kubernetes.io/version: "6.4.0"

  # ConfigMap for realm configuration files
  configMap:
    name: keycloak-config-cli-realm-master
    namespace: orch-platform
    labels:
      app.kubernetes.io/name: keycloak-config-cli
      app.kubernetes.io/instance: keycloak-config-cli

  # Job specification
  job:
    name: keycloak-config-cli
    namespace: orch-platform
    labels:
      app.kubernetes.io/name: keycloak-config-cli
      app.kubernetes.io/instance: keycloak-config-cli
      app.kubernetes.io/version: "6.4.0"

    # Job spec settings
    ttlSecondsAfterFinished: 3600
    backoffLimit: 5
    restartPolicy: Never

    # Pod labels (e.g., for Istio sidecar injection)
    podLabels:
      sidecar.istio.io/inject: "false"

    # Pod security context
    securityContext:
      seccompProfile:
        type: RuntimeDefault

    # Init container for waiting on Keycloak readiness
    initContainers:
      - name: wait-for-keycloak
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command:
          - sh
          - -c
          - |
            set -e
            echo "Waiting for Keycloak to be ready..."
            MAX_ATTEMPTS=60
            ATTEMPT=0
            while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
              if timeout 2 sh -c "echo '' | nc -w1 platform-keycloak.{{ .Values.namespace }}.svc 8080" >/dev/null 2>&1; then
                echo "Keycloak port 8080 is open!"
                exit 0
              fi
              ATTEMPT=$((ATTEMPT + 1))
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS - Waiting for Keycloak..."
              sleep 5
            done
            echo "WARNING: Keycloak did not respond, but proceeding anyway..."
            exit 0
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          runAsGroup: 65534
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

    # Main container configuration
    container:
      name: keycloak-config-cli
      image: docker.io/adorsys/keycloak-config-cli:6.4.0-26
      imagePullPolicy: IfNotPresent

      # Environment variables for keycloak-config-cli
      env:
        - name: KEYCLOAK_URL
          value: "http://platform-keycloak.{{ .Values.namespace }}.svc.cluster.local/"
        - name: KEYCLOAK_USER
          value: "admin"
        - name: KEYCLOAK_PASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-keycloak
              key: password
        - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
          value: "true"
        - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
          value: "120s"
        - name: IMPORT_VARSUBSTITUTION_ENABLED
          value: "true"
        - name: IMPORT_FILES_LOCATIONS
          value: "/config/*"
        - name: IMPORT_MANAGED_GROUP
          value: "no-delete"
        - name: IMPORT_MANAGED_REQUIRED_ACTION
          value: "no-delete"
        - name: IMPORT_MANAGED_ROLE
          value: "no-delete"
        - name: IMPORT_MANAGED_CLIENT
          value: "no-delete"
        - name: IMPORT_REMOTE_STATE_ENABLED
          value: "true"
        - name: LOGGING_LEVEL_ROOT
          value: "INFO"
        - name: LOGGING_LEVEL_KEYCLOAKCONFIGCLI
          value: "DEBUG"

      # Resource requests and limits
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi

      # Volume mounts
      volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: tmp
          mountPath: /tmp

      # Container security context
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true

    # Volume configuration
    volumes:
      - name: config
        configMap:
          name: keycloak-config-cli-realm-master
          defaultMode: 0444
      - name: tmp
        emptyDir: {}

# ArgoCD configuration for cluster-specific overrides
argo:
  # Cluster domain suffix for dynamic URL generation
  clusterDomain: "kind.internal"

# Keycloak Admin Password Synchronization Job
# This job runs after Keycloak and keycloak-config-cli to ensure the admin password
# in the PostgreSQL database matches the password stored in the bootstrap secret.
#
# This solves the issue where KC_BOOTSTRAP_ADMIN_PASSWORD env var only applies on
# first initialization, causing password mismatches on restarts/redeployments.
keycloakAdminPasswordSync:
  # Enabled by default to keep credentials synchronized
  enabled: true

  # ServiceAccount configuration
  serviceAccount:
    name: keycloak-admin-password-sync
    namespace: orch-platform
    labels:
      app.kubernetes.io/name: keycloak-admin-password-sync
      app.kubernetes.io/instance: keycloak-admin-password-sync
      app.kubernetes.io/version: "1.0.0"

  # Job specification
  job:
    name: keycloak-admin-password-sync
    namespace: orch-platform
    labels:
      app.kubernetes.io/name: keycloak-admin-password-sync
      app.kubernetes.io/instance: keycloak-admin-password-sync
      app.kubernetes.io/version: "1.0.0"

    # CronJob schedule: run every 5 minutes to ensure continuous synchronization
    # This catches password changes, operator restarts, and database modifications
    schedule: "*/5 * * * *"  # Every 5 minutes (cron format)
    
    # Job spec settings
    ttlSecondsAfterFinished: 3600  # Delete completed job pods after 1 hour
    backoffLimit: 3  # Retry failed job runs up to 3 times
    restartPolicy: Never

    # Pod labels (e.g., for Istio sidecar injection)
    podLabels:
      sidecar.istio.io/inject: "false"

    # Pod security context
    securityContext:
      seccompProfile:
        type: RuntimeDefault

    # Init containers (none needed - bash handles waits)
    initContainers: []

    # Container specification
    container:
      name: password-sync
      # Use postgres client image for database access
      image: "arunvelsriram/utils:latest"
      imagePullPolicy: IfNotPresent

      # Environment variables (set in template with secret references)
      env: []

      # Resource requests and limits
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

      # Container security context
      securityContext:
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: false  # Needs write for package cache

  # Proxy configuration for outbound connections
  proxy:
    httpProxy: ""    # HTTP_PROXY / http_proxy
    httpsProxy: ""   # HTTPS_PROXY / https_proxy
    noProxy: ""      # NO_PROXY / no_proxy (comma-separated list of hosts/domains)

# ArgoCD configuration for cluster-specific overrides
