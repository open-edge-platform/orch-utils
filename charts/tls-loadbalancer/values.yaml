# Number of TLS proxy replicas
replicaCount: 1

# NGINX image configuration
image:
  repository: nginxinc/nginx-unprivileged
  tag: alpine3.22
  pullPolicy: IfNotPresent


clusterDomain: "cluster.local"

# Backend service configuration
backend:
  service: "tinkerbell.orch-infra.svc.cluster.local"
  port: 8080

# Rate limiting for TLS proxy (matches nginx-ingress-pxe-boots structure)
nginxLBRateLimit:
  rps: 1
  connections: 5

# TLS configuration
tls:
  # Certificate secret name (managed by cert-manager)
  certificateSecretName: "tls-boots"
  
  # Diffie-Hellman parameters (base64-encoded PEM)
  # Generated with: openssl dhparam 4096 2>/dev/null | base64 -w0
  # yamllint disable-line rule:line-length
  dhParam: ""

# Resource limits per EMF conventions
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

