---

# TLS Configuration for LoadBalancer backend
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tls-loadbalancer.labels" . | nindent 4 }}
data:
  # https://wiki.mozilla.org/Security/Server_Side_TLS
  # The first cipher suite below is approved to be used by BIOS in the EN; it is NOT available in the Golang crypto library.
  # The remaining three cipher suites are approved for all other clients.
  tls-ciphers: "DHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:TLS_AES_256_GCM_SHA384"
  tls-protocols: "TLSv1.2 TLSv1.3"
  rate-limit-rps: "{{ .Values.nginxLBRateLimit.rps | default 1 }}"
  rate-limit-connections: "{{ .Values.nginxLBRateLimit.connections | default 5 }}"
  rate-limit-status-code: "429"
  # Diffie-Hellman parameters (base64-encoded)
  # Generated with: openssl dhparam 4096 2> /dev/null | base64
  dh-param.pem: |-
{{ .Values.tls.dhParam | b64dec | indent 4 }}
