# This file defines default values for the keycloak-operator Helm chart
# The keycloak-operator chart contains the Keycloak Operator deployment and CRDs
#
# VERSION MANAGEMENT:
# All version information is maintained in Chart.yaml annotations.
# When upgrading to a new Keycloak release, update the annotations in Chart.yaml.
# Templates will automatically use the updated versions.

# Keycloak Operator namespace configuration
# This namespace is where the Keycloak Operator and Keycloak resources are deployed
namespace: orch-platform

# ============================================================================
# OPERATOR DEPLOYMENT CONFIGURATION
# ============================================================================

# Operator deployment configuration
operator:
  # Deployment replicas
  replicas: 1

  # Container image (resolved from Chart.yaml annotations)
  image: "quay.io/keycloak/keycloak-operator:26.5.3"
  imagePullPolicy: IfNotPresent

  # Related Keycloak image for operator to deploy
  relatedImage:
    keycloak: "quay.io/keycloak/keycloak:26.5.3"

  # Service account name
  serviceAccountName: keycloak-operator

  # Deployment annotations (from Chart.yaml annotations)
  annotations:
    app.quarkus.io/quarkus-version: "3.27.1"
    app.quarkus.io/vcs-uri: "https://github.com/keycloak/keycloak.git"
    app.quarkus.io/build-timestamp: "2026-01-06 - 07:49:45 +0000"

  # Pod labels (from upstream)
  podLabels:
    app.kubernetes.io/managed-by: quarkus

  # Pod security context
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000

  # Container configuration
  container:
    name: keycloak-operator

    # Container security context
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
      capabilities:
        drop:
          - ALL

    # Resource allocation
    resources:
      requests:
        cpu: 300m
        memory: 450Mi
      limits:
        cpu: 700m
        memory: 450Mi

    # Container port configuration
    ports:
      - name: http
        containerPort: 8080
        protocol: TCP

    # Environment variables
    env:
      - name: KUBERNETES_NAMESPACE
        valueFrom:
          fieldRef:
            fieldPath: metadata.namespace
      - name: RELATED_IMAGE_KEYCLOAK
        # Resolved from Chart.yaml annotations in templates
        value: "quay.io/keycloak/keycloak:26.5.3"

    # Liveness probe
    livenessProbe:
      httpGet:
        scheme: HTTP
        path: /q/health/live
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
      successThreshold: 1

    # Readiness probe
    readinessProbe:
      httpGet:
        scheme: HTTP
        path: /q/health/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
      successThreshold: 1

    # Startup probe
    startupProbe:
      httpGet:
        scheme: HTTP
        path: /q/health/started
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 3
      successThreshold: 1

# Security context for operator pods (pod-level)
securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Container security context (backward compatibility)
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL

# Temporary volume mounts for operator
volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: var-cache
    mountPath: /var/cache

# Empty directory volumes for temporary storage
volumes:
  - name: tmp
    emptyDir: {}
  - name: var-cache
    emptyDir: {}
