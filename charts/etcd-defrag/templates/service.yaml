apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: kube-system
spec:
  type: ClusterIP
  ports:
  - name: etcd-client
    port: 2379
    targetPort: 2379
    protocol: TCP
  selector:
    component: etcd
