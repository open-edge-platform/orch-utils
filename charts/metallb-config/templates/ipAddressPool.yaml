---

apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: traefik
  namespace: metallb-system
spec:
  addresses:
  - "{{ .Values.TraefikIP }}/32"
  autoAssign: true
  avoidBuggyIPs: true
  serviceAllocation:
    priority: 1
    namespaces:
      - orch-gateway

---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: argocd-server
  namespace: metallb-system
spec:
  addresses:
  - "{{ .Values.ArgoIP }}/32"
  autoAssign: true
  avoidBuggyIPs: true
  serviceAllocation:
    priority: 1
    namespaces:
      - argocd

---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: haproxy-controller
  namespace: metallb-system
spec:
  addresses:
  - "{{ .Values.HAProxyIP }}/32"
  autoAssign: true
  avoidBuggyIPs: true
  serviceAllocation:
    priority: 1
    namespaces:
      - orch-boots