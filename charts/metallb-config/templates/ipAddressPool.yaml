---

{{- if and (eq .Values.TraefikIP .Values.ArgoIP) (eq .Values.TraefikIP .Values.HaproxyIP) }}
# Single-IP mode: one shared pool for all services.
# MetalLB rejects overlapping /32 pools, so when all three IPs are the same we
# create a single pool. Services sharing the IP must use different ports and the
# metallb.universe.tf/allow-shared-ip annotation.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: orch-pool
  namespace: metallb-system
spec:
  addresses:
  - "{{ .Values.TraefikIP }}/32"
  autoAssign: true
  avoidBuggyIPs: true

{{- else }}
# Multi-IP mode: separate pools per service
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: traefik
  namespace: metallb-system
spec:
  addresses:
  - "{{ .Values.TraefikIP }}/32"
  autoAssign: true
  avoidBuggyIPs: true
  serviceAllocation:
    priority: 1
    namespaces:
      - orch-gateway

---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: argocd-server
  namespace: metallb-system
spec:
  addresses:
  - "{{ .Values.ArgoIP }}/32"
  autoAssign: true
  avoidBuggyIPs: true
  serviceAllocation:
    priority: 1
    namespaces:
      - argocd

---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: haproxy-controller
  namespace: metallb-system
spec:
  addresses:
  - "{{ .Values.HaproxyIP }}/32"
  autoAssign: true
  avoidBuggyIPs: true
  serviceAllocation:
    priority: 1
    namespaces:
      - orch-boots
{{- end }}
