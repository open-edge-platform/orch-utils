apiVersion: v1
kind: Service
metadata:
  name: {{ include "component-status.fullname" . }}
  labels:
    {{- include "component-status.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "component-status.selectorLabels" . | nindent 4 }}
