---

# Default values for component-status service
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  registry:
  repository: common/component-status
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 100m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi

livenessProbe:
  enabled: true
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Traefik IngressRoute Configuration
traefikRoute:
  enabled: false
  namespace: orch-gateway
  host: api.example.com
  priority: 40
  secretName: ""
  tlsOption: ""
  middlewares:
    - validate-jwt
    - secure-headers

# Component Status Configuration
# This configuration is generated by the installer and reflects
# the installed components and features of the orchestrator
componentStatus:
  schema-version: "1.0"
  orchestrator:
    version: "26.0.0"
    features:
      - name: "keycloak"
        version: "26.0.1"
        description: "Identity and access management"
        status: "enabled"

      - name: "vault"
        version: "1.15.2"
        description: "Secrets management"
        status: "enabled"

      - name: "observability"
        version: "26.0.0"
        description: "Monitoring and logging stack"
        status: "enabled"
        features:
          - name: "grafana"
            version: "11.3.0"
            description: "Metrics visualization"
            status: "enabled"

          - name: "prometheus"
            version: "2.45.0"
            description: "Metrics collection"
            status: "enabled"

          - name: "loki"
            version: "2.9.2"
            description: "Log aggregation"
            status: "enabled"

      - name: "multitenancy"
        version: "26.0.0"
        description: "Multi-tenant support"
        status: "enabled"

      - name: "app-orch"
        version: "26.0.0"
        description: "Application orchestration"
        status: "enabled"
        features:
          - name: "fleet"
            version: "0.10.0"
            description: "GitOps fleet management"
            status: "enabled"

      - name: "cluster-orch"
        version: "26.0.0"
        description: "Cluster lifecycle management"
        status: "enabled"
        features:
          - name: "capi"
            version: "1.8.5"
            description: "Cluster API"
            status: "enabled"
