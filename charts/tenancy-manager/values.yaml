---
global:
  tainted: false
  name: tenancy-manager
  postgresql:
    host: ""

replicaCount: 1

licensingEnabled: false

imagePullSecrets: ""
image:
  registry: registry-rs.edgeorchestration.intel.com/edge-orch
  repository: common/tenancy-manager
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: tenancy-manager-service-account

serviceArgs:
  serverAddress: "0.0.0.0:8080"
  baseRESTURL: "/"
  globalLogLevel: "info"
  echoDebug: false
  allowedCorsOrigins: "http://localhost:3000"
  traceURL: "mi-fluent-bit:4318"
  enableTracing: false
  enableAuditing: true
  enableAuth: true

# humanReadableLogs: "enable"
logging:
  level: error

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65534

resources: {}
# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
# limits:
#   cpu: 100m
#   memory: 128Mi
# requests:
#   cpu: 100m
#   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: true
  annotations: {}
  # Path match for tenancy API endpoints
  pathMatch: "PathRegexp(`^/v1/(orgs|projects)`)"
  entryPoints:
    - web
  middlewares:
    - name: validate-jwt
      namespace: orch-iam

# PostgreSQL configuration
postgresql:
  enabled: true
  # Host can be overridden via global.postgresql.host or postgresql.host
  host: ""
  port: 5432
  database: tenancy
  username: postgres
  # Password should be provided via existingSecret or set explicitly
  existingSecret: ""
  existingSecretPasswordKey: "postgresql-password"

# Tenancy Manager specific configuration
tenancyManager:
  # Default org and project for bootstrap (leave empty to skip bootstrap)
  # Disabled: org/project setup is handled by the deploy script / mage tenantUtils:createDefaultMtSetup
  defaultOrgName: ""
  defaultProjectName: ""

  # Tenant-admin bootstrap. When enabled (typically driven by
  # EMF_DEFAULT_TENANCY=true), the tenancy-manager Pod creates a Keycloak
  # `tenant-admin` user, stores its password in a Secret, and adds the user
  # to the org-level admin group and the project-level edge groups for the
  # default org/project created by store.Bootstrap.
  bootstrapTenantAdmin:
    enabled: false
    keycloakService: platform-keycloak
    keycloakNamespace: orch-platform
    keycloakPort: "8080"
    keycloakRealm: master
    keycloakAdminUser: admin
    tenantAdminUser: tenant-admin
    # Namespace where the generated password Secret is stored.
    # Defaults to the pod's own namespace (empty string).
    secretNamespace: ""
    secretName: tenant-admin-password
    projectAdminGroups: Project-Manager-Group
    projectEdgeGroups: Edge-Manager-Group,Edge-Onboarding-Group,Edge-Operator-Group,Host-Manager-Group

  # OIDC configuration for JWT validation
  oidcServerURL: ""

  # Internal auth token for controller endpoints
  # Should be provided via existingSecret in production
  internalAuthToken: ""
  internalAuthTokenSecret: ""
  internalAuthTokenSecretKey: "internal-auth-token"

  # Registered controllers that will be tracked.
  # Note: keycloak-tenant-controller handles BOTH org and project events
  # (creates Keycloak realm groups/roles for orgs AND projects), so it is
  # listed under both `org` and `project`.
  controllers:
    org:
      - keycloak-tenant-controller
    project:
      - app-orch-tenant-controller
      - app-deployment-manager
      - keycloak-tenant-controller
      - infra-tenant-controller
      - cluster-manager
      - observability-tenant-controller
      - metadata-broker
