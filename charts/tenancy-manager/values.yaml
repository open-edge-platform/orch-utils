---
global:
  tainted: false
  name: tenancy-manager

replicaCount: 1

imagePullSecrets: ""
image:
  registry: registry-rs.edgeorchestration.intel.com/edge-orch
  repository: common/tenancy-manager
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: tenancy-manager-service-account

# Tenancy-manager application config (rendered into ConfigMap).
config:
  eventRetention: "168h"
  cleanupInterval: "1m"
  defaultOrgName: ""
  defaultProjectName: ""
  # oidcServerURL: "http://platform-keycloak.orch-platform.svc:8080/realms/master"
  controllers:
    org:
      - "keycloak-tenant-controller"
    project:
      - "app-orch-tenant-controller"
      - "app-deployment-manager"
      - "keycloak-tenant-controller"
      - "infra-tenant-controller"
      - "cluster-manager"
      - "observability-tenant-controller"
      - "metadata-broker"

logging:
  level: info

podAnnotations: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 65534

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

postgres: {}
# postgres:
#   secrets: iam-tenancy-local-postgresql

# Extra environment variables injected into the container.
extraEnv: []
# extraEnv:
#   - name: OIDC_SERVER_URL
#     value: "http://platform-keycloak.orch-platform.svc:8080/realms/master"

nodeSelector: {}

tolerations: []

affinity: {}
