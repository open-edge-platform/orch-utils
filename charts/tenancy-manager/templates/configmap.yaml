---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenancy-config
  namespace: {{ default .Release.Namespace .Values.global.namespace }}
data:
  config.yaml: |
    # Tenancy Manager configuration
    listen_addr: "0.0.0.0:8080"

    # Default org/project for bootstrap
    default_org_name: {{ .Values.tenancyManager.defaultOrgName | quote }}
    default_project_name: {{ .Values.tenancyManager.defaultProjectName | quote }}

    # OIDC server URL for JWT authentication
    {{- if .Values.tenancyManager.oidcServerURL }}
    oidc_server_url: {{ .Values.tenancyManager.oidcServerURL | quote }}
    {{- end }}

    # Registered controllers
    controllers:
      org:
        {{- range .Values.tenancyManager.controllers.org }}
        - {{ . | quote }}
        {{- end }}
      project:
        {{- range .Values.tenancyManager.controllers.project }}
        - {{ . | quote }}
        {{- end }}

    # Cleanup interval for hard-deleting soft-deleted resources
    cleanup_interval: "1m"
