---
{{- $passwords := dict }}
{{- $namespace := .Values.namespace }}
{{- range $k, $v := .Values.databases }}
{{- $currentPassword := randAlphaNum 16 | nospace }}
{{- $_ := set $passwords $v.name $currentPassword}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.name }}-local-postgresql
  namespace: {{ $v.namespace }}
  {{- with $.Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    managed-by: edge-manageability-framework
stringData:
  PGUSER: "{{$v.namespace}}-{{ $v.name }}_user"
  PGPASSWORD: "{{ $currentPassword }}"
  PGDATABASE: "{{$v.namespace}}-{{ $v.name}}"
  PGHOST: "{{ $.Values.host }}"
  PGPORT: "5432"
---
# In cloud deployments, we create a separate secret that points to the reader endpoint 
# which is load-balanced to multiple read replicas.
# There is no such reader endpoint provided for local Postgres yet,
# but we create this secret to provide a similar look-and-feel to the cloud deployments.
# It still points to the same PGHOST as the default read-write endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $v.name }}-reader-local-postgresql
  namespace: {{ $v.namespace }}
  {{- with $.Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    managed-by: edge-manageability-framework
stringData:
  PGUSER: "{{$v.namespace}}-{{ $v.name }}_user"
  PGPASSWORD: "{{ $currentPassword }}"
  PGDATABASE: "{{$v.namespace}}-{{ $v.name}}"
  PGHOST: "{{ $.Values.host }}"
  PGPORT: "5432"
---
apiVersion: v1
kind: Secret
metadata:
  name: "{{$v.namespace}}-{{ $v.name}}"
  namespace: {{ $namespace }}
  {{- with $.Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    managed-by: edge-manageability-framework
type: kubernetes.io/basic-auth
stringData:
  username: "{{$v.namespace}}-{{ $v.name }}_user"
  password: "{{ $currentPassword }}"
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: passwords
  namespace:  {{ .Values.namespace }}
  labels:
    managed-by: edge-manageability-framework
stringData:
{{- $passwords|toYaml|nindent 2 }}
