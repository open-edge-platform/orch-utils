---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "certificate-file-server.fullname" . }}
  labels:
    {{- include "certificate-file-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "certificate-file-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "certificate-file-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # livenessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            {{- if ne .Values.secretName "" }}
            - name: data
              mountPath: {{ required "A valid rootFolder entry required!" .Values.rootFolder }}
              readOnly: true
            {{- end }}
            {{- if .Values.infraConfig }}
            - name: installer-script
              mountPath: {{ required "A valid rootFolder entry required!" .Values.rootFolder }}installer/
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "certificate-file-server.fullname" . }}
        {{- if ne .Values.secretName "" }}
        - name: data
          secret:
            secretName: {{ .Values.secretName }}
        {{- end }}
        {{- if .Values.infraConfig }}
        - name: installer-script
          configMap:
            name: {{ include "certificate-file-server.fullname" . }}
            items:
              - key: edge-node-installer.sh
                path: edge-node-installer.sh
                mode: 0755
              - key: edge-node-uninstaller.sh
                path: edge-node-uninstaller.sh
                mode: 0755
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
