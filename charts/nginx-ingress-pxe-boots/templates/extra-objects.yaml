---

# nginx-ingress-boots uses a self-signed TLS server certificate managed by cert-manager
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: boots-selfsigned-issuer
  namespace: orch-boots
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: tls-boots
  namespace: orch-boots
spec:
  secretName: tls-boots
  duration: 8765h0m0s # 1 year
  renewBefore: 2160h0m0s # 90 days
  subject:
    organizations:
      - Intel Corporation
    countries:
      - US
  isCA: true
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 3072
  usages:
    - digital signature
    - server auth
  commonName: {{ required "A valid commonName is required!" .Values.commonName }}
  dnsNames:
    - {{ required "A valid commonName is required!" .Values.commonName }}
  issuerRef:
    name: boots-selfsigned-issuer
    kind: Issuer
---
{{- if and .Values.haproxyIngress (eq .Values.haproxyIngress.enabled true) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tinkerbell-haproxy-ingress
  namespace: orch-infra
  annotations:
    # HAProxy Ingress Controller
    # Rate limiting is configured globally in the HAProxy helm chart deployment
    # See: edge-manageability-framework/argocd/applications/configs/ingress-haproxy.yaml
    description: "HAProxy Ingress for Tinkerbell PXE boots services"
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - {{ required "A valid commonName is required!" .Values.commonName }}
      secretName: tls-boots
  rules:
    - host: {{ required "A valid commonName is required!" .Values.commonName }}
      http:
        paths:
          # Tinkerbell Stack Routes
          - path: /tink-stack
            pathType: Prefix
            backend:
              # This assumes tinkerbell service exists and routes to healthy endpoints
              service:
                name: tinkerbell
                port:
                  number: 8080
{{- end }}
